// ------------------------------------------------------------------ small pure helpers

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype;
}

/** The path of the first key named __proto__, constructor or prototype at any depth, or "". */
function protoKeyPath(v, path) {
  if (Array.isArray(v)) {
    for (let i = 0; i < v.length; i++) { const p = protoKeyPath(v[i], path + "." + i); if (p) return p; }
  } else if (v !== null && typeof v === "object") {
    for (const k of Object.keys(v)) {
      const here = path ? path + "." + k : k;
      if (k === "__proto__" || k === "constructor" || k === "prototype") return here;
      const p = protoKeyPath(v[k], here);

    }

  return "";
}

const CONTROL_RE = /[\u0000-\u0008\u000b-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2028\u2029\u2066-\u2069\ufeff]/;

// character at all, and encodeURIComponent throws on it, which would leave the request email unbuilt.
const SURROGATE_RE = /[\ud800-\udbff][\udc00-\udfff]|[\ud800-\udfff]/g;
const LINE_BREAK_RE = /[\n\t]/;
const EMAIL_RE = /^[A-Za-z0-9._+-]{1,64}@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.[A-Za-z]{2,24}$/;
const PHONE_RE = /^[0-9 +().-]{7,25}$/;
const COLOR_RE = /^#[0-9a-fA-F]{6}$/;

function fixSurrogates(s, rep) { return s.replace(SURROGATE_RE, m => (m.length === 2 ? m : rep)); }

function isEmail(s) {

/** A phone number has 7 to 15 digits and only the characters people write numbers with. */
function isPhone(s) {
  if (typeof s !== "string" || !PHONE_RE.test(s)) return false;
  const d = s.replace(/[^0-9]/g, "").length;
  return d >= 7 && d <= 15;
}

/** Only an https: link to a named host, written out in full, with no login part. Anything else is refused,

  return u.href;
}

function isIsoDate(s) {
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;

function localToday(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

/** The same calendar day `years` years earlier (29 Feb becomes 28 Feb), as YYYY-MM-DD. */
function yearsBefore(iso, years) {
  const y = +iso.slice(0, 4) - years, m = iso.slice(5, 7);
  let d = iso.slice(8, 10);
  if (m === "02" && d === "29" && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) d = "28";
  return String(y).padStart(4, "0") + "-" + m + "-" + d;
}

/** a / b rounded half up, for non-negative integers (tax and deposit cents). */
function roundDiv(a, b) { return Math.floor((2 * a + b) / (2 * b)); }

function money(cents) {
  const neg = cents < 0;
  const c = Math.abs(cents);
  const dollars = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + "$" + dollars + "." + pad2(c % 100);
}

/** 15000 -> "15%", 9975 -> "9.975%". */
function ratePercent(rate) {
  const whole = Math.floor(rate / 1000), frac = String(rate % 1000).padStart(3, "0").replace(/0+$/, "");
  return whole + (frac ? "." + frac : "") + "%";
}

/** Relative luminance contrast of a #rrggbb colour against white. */
function contrastWithWhite(hex) {
  const ch = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  const lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  return 1.05 / (lum + 0.05);
}

// ------------------------------------------------------------------ the strict reader

/** Read a rules object as untrusted data. Returns {rules, errors}: `rules` is the canonical copy (key order fixed,
    text trimmed, the link normalised) when there are no errors, else null. Every problem is named by its path. */
function readRules(raw) {
  const errors = [];
  const bad = (path, msg) => { errors.push({ path, msg }); };
  if (!isPlainObject(raw)) return { rules: null, errors: [{ path: "", msg: "The rules must be one JSON object." }] };
  const proto = protoKeyPath(raw, "");
  if (proto) return { rules: null, errors: [{ path: proto, msg: "A key named __proto__, constructor or prototype is not allowed." }] };

  const keysOf = (obj, path, allowed, optional) => {
    if (!isPlainObject(obj)) { bad(path, "Must be a group of settings."); return false; }
    for (const k of Object.keys(obj)) if (!allowed.includes(k)) bad(path ? path + "." + k : k, "Unknown setting.");
    for (const k of allowed) if (!(k in obj) && !(optional || []).includes(k)) bad(path ? path + "." + k : k, "Missing.");
    return true;
  };
  const line = (v, path, min, max) => {
    if (typeof v !== "string") { bad(path, "Must be text."); return ""; }
    const s = v.trim();
    if (CONTROL_RE.test(s) || hasHalfPair(s) || LINE_BREAK_RE.test(s) || /\r/.test(s)) bad(path, "Must be one line of plain text.");
    else if (s.length < min) bad(path, min === 1 ? "Required." : "Needs at least " + min + " characters.");
    else if (s.length > max) bad(path, "Too long: at most " + max + " characters.");
    return s;
  };
  const text = (v, path, max) => {
    if (typeof v !== "string") { bad(path, "Must be text."); return ""; }
    const s = v.replace(/\r\n?/g, "\n").replace(/[ \t]+$/gm, "").trim();
    if (CONTROL_RE.test(s) || hasHalfPair(s) || /\t/.test(s)) bad(path, "Must be plain text.");
    else if (s.length > max) bad(path, "Too long: at most " + max + " characters.");
    return s;
  };
  const int = (v, path, min, max, what) => {
    if (typeof v !== "number" || !Number.isInteger(v)) { bad(path, "Must be a whole number" + (what ? " (" + what + ")" : "") + "."); return 0; }
    if (v < min || v > max) bad(path, "Must be from " + min + " to " + max + (what ? " " + what : "") + ".");
    return v;
  };
  const cents = (v, path, min, max) => {
    if (typeof v !== "number" || !Number.isInteger(v)) { bad(path, "Must be an amount in whole cents."); return 0; }
    if (v < min || v > max) bad(path, "Must be from " + money(min) + " to " + money(max) + ".");
    return v;
  };

  keysOf(raw, "", TOP_KEYS, ["sample", "rush", "complex"]);
  const out = {};
  if (raw.format !== QUOTE_FORMAT) bad("format", "Not a quote rules file (format line missing).");
  if (raw.version !== QUOTE_VERSION) bad("version", "Version " + QUOTE_VERSION + " is the only version this page reads.");
  out.format = QUOTE_FORMAT;
  out.version = QUOTE_VERSION;
  if ("sample" in raw) {
    const s = line(raw.sample, "sample", 0, 300);
    if (s) out.sample = s;
  }

  const f = raw.firm, firm = {};
  if (keysOf(f, "firm", ["name", "logoText", "color", "email", "phone", "area"])) {
    firm.name = line(f.name, "firm.name", 1, 80);
    firm.logoText = line(f.logoText, "firm.logoText", 1, 4);
    firm.color = typeof f.color === "string" ? f.color.toLowerCase() : f.color;
    if (!COLOR_RE.test(String(f.color))) bad("firm.color", "Must be a colour written like #1d4f91.");
    else if (contrastWithWhite(firm.color) < 4.5) bad("firm.color", "Too light: white text on it would be hard to read. Pick a darker colour.");
    firm.email = line(f.email, "firm.email", 1, 120);
    if (firm.email && !isEmail(firm.email)) bad("firm.email", "Not an email address.");
    firm.phone = line(f.phone, "firm.phone", 0, 25);
    if (firm.phone && !isPhone(firm.phone)) bad("firm.phone", "Not a phone number (digits, spaces, + - ( ) . only).");
    firm.area = line(f.area, "firm.area", 0, 120);
  }
  out.firm = firm;
  out.pricesFrom = raw.pricesFrom;
  if (!isIsoDate(raw.pricesFrom)) bad("pricesFrom", "Must be a date written YYYY-MM-DD.");
  out.validDays = int(raw.validDays, "validDays", 1, 365, "days");

  const list = (arr, path, defaults, what) => {
    const res = [];
    if (!Array.isArray(arr) || arr.length < 1 || arr.length > defaults.length) { bad(path, "Offer at least one " + what + "."); return res; }
    const ids = defaults.map(d => d[0]), seen = new Set();
    arr.forEach((x, i) => {
      const p = path + "." + i;
      if (!keysOf(x, p, ["id", "label"])) return;
      if (!ids.includes(x.id) || seen.has(x.id)) { bad(p + ".id", "Unknown or repeated " + what + "."); return; }
      seen.add(x.id);
      res.push({ id: x.id, label: line(x.label, p + ".label", 1, 60) });
    });
    return res;
  };
  out.purposes = list(raw.purposes, "purposes", PURPOSE_DEFAULTS, "purpose");
  out.types = list(raw.types, "types", TYPE_DEFAULTS, "property type");

  const fees = {};
  if (keysOf(raw.fees, "fees", out.purposes.map(p => p.id))) {
    for (const p of out.purposes) {
      const row = raw.fees[p.id], r = {};
      if (keysOf(row, "fees." + p.id, out.types.map(t => t.id))) {
        for (const t of out.types) {
          const v = row[t.id], path = "fees." + p.id + "." + t.id;
          r[t.id] = v === null ? null : cents(v, path, 100, MAX_FEE);
        }
      }
      fees[p.id] = r;
    }
  }
  out.fees = fees;

  const retro = {};
  if (keysOf(raw.retro, "retro", ["fee", "confirmYears"])) {
    retro.fee = cents(raw.retro.fee, "retro.fee", 0, MAX_FEE);
    retro.confirmYears = int(raw.retro.confirmYears, "retro.confirmYears", 0, 100, "years");
  }
  out.retro = retro;

  if (raw.rush !== undefined && raw.rush !== null) {
    if (keysOf(raw.rush, "rush", ["fee", "turnaround"])) {
      out.rush = { fee: cents(raw.rush.fee, "rush.fee", 100, MAX_FEE), turnaround: line(raw.rush.turnaround, "rush.turnaround", 1, 80) };
    }
  }

  const tr = raw.travel, travel = {};
  if (isPlainObject(tr) && tr.mode === "none") {
    keysOf(tr, "travel", ["mode"]);
    travel.mode = "none";
  } else if (isPlainObject(tr) && tr.mode === "towns") {
    keysOf(tr, "travel", ["mode", "zones"]);
    travel.mode = "towns";
    travel.zones = [];
    const seen = new Map();
    if (!Array.isArray(tr.zones) || tr.zones.length < 1 || tr.zones.length > 20) bad("travel.zones", "Add 1 to 20 zones.");
    else tr.zones.forEach((z, i) => {
      const p = "travel.zones." + i;
      if (!keysOf(z, p, ["label", "fee", "towns"])) return;
      const zone = { label: line(z.label, p + ".label", 1, 60), fee: cents(z.fee, p + ".fee", 0, MAX_FEE), towns: [] };
      if (!Array.isArray(z.towns) || z.towns.length < 1 || z.towns.length > 300) bad(p + ".towns", "List 1 to 300 towns.");
      else z.towns.forEach((t, j) => {
        const name = line(t, p + ".towns", 1, 60);
        const key = name.toLowerCase();
        if (name && seen.has(key)) bad(p + ".towns", "\u201c" + name + "\u201d is listed twice (" + seen.get(key) + ").");
        else if (name) seen.set(key, zone.label || "zone " + (i + 1));
        zone.towns.push(name);
      });
      travel.zones.push(zone);
    });
  } else if (isPlainObject(tr) && tr.mode === "km") {
    keysOf(tr, "travel", ["mode", "from", "bands"]);
    travel.mode = "km";
    travel.from = line(tr.from, "travel.from", 1, 80);
    travel.bands = [];
    if (!Array.isArray(tr.bands) || tr.bands.length < 1 || tr.bands.length > 10) bad("travel.bands", "Add 1 to 10 distance bands.");
    else tr.bands.forEach((b, i) => {
      const p = "travel.bands." + i;
      if (!keysOf(b, p, ["upTo", "fee"])) return;
      const band = { upTo: int(b.upTo, p + ".upTo", 1, 1000, "km"), fee: cents(b.fee, p + ".fee", 0, MAX_FEE) };
      if (i > 0 && travel.bands[i - 1] && band.upTo <= travel.bands[i - 1].upTo) bad(p + ".upTo", "Each band must reach further than the one before.");
      travel.bands.push(band);
    });
  } else {
    bad("travel", "Travel must be none, towns or km.");
  }
  out.travel = travel;

  if (raw.complex !== undefined && raw.complex !== null) {
    if (keysOf(raw.complex, "complex", ["hint"])) out.complex = { hint: line(raw.complex.hint, "complex.hint", 1, 200) };
  }
  out.confirmHours = int(raw.confirmHours, "confirmHours", 1, 168, "hours");

  const codes = PROVINCES.map(p => p[0]);
  out.provinces = [];
  if (!Array.isArray(raw.provinces) || raw.provinces.length < 1) bad("provinces", "Pick the province (or provinces) your properties are in.");
  else raw.provinces.forEach((c, i) => {
    if (!codes.includes(c) || out.provinces.includes(c)) bad("provinces." + i, "Unknown or repeated province.");
    else out.provinces.push(c);
  });
  out.tax = {};
  if (keysOf(raw.tax, "tax", out.provinces)) {
    for (const c of out.provinces) {
      const lines = raw.tax[c], p = "tax." + c;
      if (!Array.isArray(lines) || lines.length > 2) { bad(p, "Up to two tax lines."); continue; }
      out.tax[c] = lines.map((l, i) => {
        if (!keysOf(l, p + "." + i, ["label", "rate"])) return { label: "", rate: 0 };
        return { label: line(l.label, p + "." + i + ".label", 1, 20), rate: int(l.rate, p + "." + i + ".rate", 1, 30000, "thousandths of a percent") };
      });
    }
  }

  const d = raw.deposit;
  if (isPlainObject(d) && d.mode === "none") { keysOf(d, "deposit", ["mode"]); out.deposit = { mode: "none" }; }
  else if (isPlainObject(d) && d.mode === "percent") { keysOf(d, "deposit", ["mode", "percent"]); out.deposit = { mode: "percent", percent: int(d.percent, "deposit.percent", 1, 100, "percent") }; }
  else if (isPlainObject(d) && d.mode === "fixed") { keysOf(d, "deposit", ["mode", "fee"]); out.deposit = { mode: "fixed", fee: cents(d.fee, "deposit.fee", 100, MAX_FEE) }; }
  else { bad("deposit", "Deposit must be none, percent or fixed."); out.deposit = { mode: "none" }; }

  out.turnaround = line(raw.turnaround, "turnaround", 1, 120);
  const pay = {};
  if (keysOf(raw.payment, "payment", ["etransfer", "link", "note"])) {
    pay.etransfer = line(raw.payment.etransfer, "payment.etransfer", 0, 120);
    if (pay.etransfer && !isEmail(pay.etransfer)) bad("payment.etransfer", "Not an email address.");
    const rawLink = typeof raw.payment.link === "string" ? raw.payment.link.trim() : raw.payment.link;
    pay.link = "";
    if (typeof rawLink !== "string") bad("payment.link", "Must be text.");
    else if (rawLink) {
      pay.link = httpsLink(rawLink);
      if (!pay.link) bad("payment.link", "Only a full https:// link to your payment page is allowed.");
    }
    pay.note = line(raw.payment.note, "payment.note", 0, 200);
    if (out.deposit.mode !== "none" && !pay.etransfer && !pay.link) bad("payment", "A deposit needs an e-transfer email or a payment link.");
  }
  out.payment = pay;
  out.terms = text(raw.terms, "terms", 8000);

  return errors.length ? { rules: null, errors } : { rules: out, errors: [] };
}

// ------------------------------------------------------------------ the arithmetic

/** Work out the quote for the client's choices. `sel`: {purpose, type, when: "current"|"past", date, province,
    place: "zone.town" | "band index" | "other" | "beyond", rush, complex}. Returns
    {status: "incomplete"|"confirm"|"priced", missing, problems, confirm, lines, subtotal, taxes, total, deposit}.
    Nothing here guesses: a blank price, an unlisted town or a date too far back becomes "we'll confirm". */
function priceQuote(rules, sel, today) {
  const r = { status: "incomplete", missing: [], problems: [], confirm: [], lines: [], subtotal: 0, taxes: [], total: 0, deposit: 0, province: "", place: null };
  const p = rules.purposes.find(x => x.id === sel.purpose);
  const t = rules.types.find(x => x.id === sel.type);
  if (!p) r.missing.push("purpose");
  if (!t) r.missing.push("type");
  if (sel.when !== "current" && sel.when !== "past") r.missing.push("when");
  else if (sel.when === "past") {
    if (!sel.date) r.missing.push("date");
    else if (!isIsoDate(sel.date)) r.problems.push("dateBad");
    else if (sel.date >= today) r.problems.push("dateNotPast");
  }
  const tr = rules.travel;
  if (tr.mode === "towns") {
    if (!sel.place) r.missing.push("place");
    else if (sel.place === "other") r.place = { other: true };
    else {
      const m = /^(\d+)\.(\d+)$/.exec(sel.place);
      const z = m && tr.zones[+m[1]];
      if (!z || !z.towns[+m[2]]) r.missing.push("place");
      else r.place = { zone: z, town: z.towns[+m[2]] };
    }
  } else if (tr.mode === "km") {
    if (!sel.place) r.missing.push("place");
    else if (sel.place === "beyond") r.place = { beyond: tr.bands[tr.bands.length - 1].upTo };
    else {
      const i = /^\d+$/.test(sel.place) ? +sel.place : -1;
      if (!tr.bands[i]) r.missing.push("place");
      else r.place = { band: tr.bands[i], index: i };
    }
  }
  r.province = rules.provinces.length === 1 ? rules.provinces[0] : sel.province;
  if (!rules.provinces.includes(r.province)) { r.province = ""; r.missing.push("province"); }
  if (r.missing.length || r.problems.length) return r;

  const base = rules.fees[p.id][t.id];
  if (base === null) r.confirm.push({ code: "caseByCase" });
  else r.lines.push({ code: "base", cents: base });
  if (sel.when === "past") {
    if (rules.retro.confirmYears > 0 && sel.date < yearsBefore(today, rules.retro.confirmYears)) r.confirm.push({ code: "oldDate", years: rules.retro.confirmYears });
    else if (rules.retro.fee > 0) r.lines.push({ code: "retro", cents: rules.retro.fee });
  }
  const pl = r.place || {};  // null when the firm charges no travel
  if (pl.other) r.confirm.push({ code: "townOther" });
  if (pl.beyond) r.confirm.push({ code: "beyond", km: pl.beyond });
  if (pl.zone && pl.zone.fee > 0) r.lines.push({ code: "travelZone", cents: pl.zone.fee, zone: pl.zone.label });
  if (pl.band && pl.band.fee > 0) r.lines.push({ code: "travelKm", cents: pl.band.fee, index: pl.index });
  if (sel.rush && rules.rush) r.lines.push({ code: "rush", cents: rules.rush.fee });
  if (sel.complex && rules.complex) r.confirm.push({ code: "complex" });
  if (r.confirm.length) { r.status = "confirm"; return r; }

  r.subtotal = r.lines.reduce((a, l) => a + l.cents, 0);
  r.taxes = rules.tax[r.province].map(l => ({ label: l.label, rate: l.rate, cents: roundDiv(r.subtotal * l.rate, 100000) }));
  r.total = r.subtotal + r.taxes.reduce((a, l) => a + l.cents, 0);
  const d = rules.deposit;
  r.deposit = d.mode === "percent" ? roundDiv(r.total * d.percent, 100) : d.mode === "fixed" ? Math.min(d.fee, r.total) : 0;
  r.status = "priced";
  return r;
}

// ------------------------------------------------------------------ DOM

/** Build an element. Text always goes in as text (never HTML); an href must be https:, mailto:, tel: or #. */
function el(tag, attrs) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "href") {
      if (!/^(https:|mailto:|tel:|#)/.test(String(v))) throw new Error("refused link");
      n.setAttribute("href", v);
    } else if (/^(src|srcdoc|style|innerHTML|outerHTML)$/i.test(k)) throw new Error("refused attribute " + k);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [arguments[i]].flat(Infinity);
    for (const c of kids) if (c !== null && c !== undefined && c !== false) n.append(c instanceof Node ? c : String(c));
  }
  return n;
}

/** Replace a node's children; nested lists are flattened and null, undefined and false are skipped (the DOM's own
    replaceChildren would print them as text). */
function fill(node) {
  node.replaceChildren(...[].slice.call(arguments, 1).flat(Infinity).filter(k => k !== null && k !== undefined && k !== false));
  return node;
}

function makeRef() {
  const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", out = [];
  const buf = new Uint8Array(16);
  while (out.length < 4) {
    crypto.getRandomValues(buf);
    for (const b of buf) if (b < 248 && out.length < 4) out.push(abc[b % 31]);
  }
  return "Q-" + TODAY.slice(2).replace(/-/g, "") + "-" + out.join("");
}

function lineLabel(l) {

  if (l.code === "base") return t("lineBase", { type: ty.label, purpose: p.label });
  if (l.code === "retro") return t("lineRetro");
  if (l.code === "travelZone") return t("lineTravelZone", { zone: l.zone });
  if (l.code === "travelKm") return t("lineTravelKm", { band: bandText(l.index, true) });

function priceRows(q) {
  const rows = q.lines.map(l => [lineLabel(l), money(l.cents), ""]);
  if (q.taxes.length) rows.push([t("subtotal"), money(q.subtotal), "sum"]);
  for (const x of q.taxes) rows.push([t("taxLine", { label: x.label, rate: ratePercent(x.rate) }), money(x.cents), "sum"]);
  rows.push([t("total"), money(q.total), "total"]);
  const d = RULES.deposit;

    rows.push([d.mode === "percent" ? t("depositPercent", { percent: d.percent }) : t("depositFixed"), money(q.deposit), "dep"]);
    if (q.total - q.deposit > 0) rows.push([t("balance"), money(q.total - q.deposit), "sum"]);

  return rows;

function placeText(q) {
  if (!q.place) return "";
  if (q.place.other) return t("placeOther");
  if (q.place.beyond) return t("bandBeyond", { km: q.place.beyond, from: RULES.travel.from });
  if (q.place.zone) return q.place.town + " (" + q.place.zone.label + ")";
  if (q.place.band) return bandText(q.place.index, false);
  return "";
}

function effectiveText() { return sel.when === "past" && isIsoDate(sel.date) ? longDate(sel.date) + " (" + sel.date + ")" : t("effCurrent"); }

function mailParts() {
  const R = RULES, q = current();
  const p = R.purposes.find(x => x.id === sel.purpose), ty = R.types.find(x => x.id === sel.type);
  const kv = (k, v) => t("mailKV", { k, v });
  const c = {};
  for (const f of FIELDS) c[f.id] = cutText(clean(who[f.id]), f.max);
  const L = [t("mailIntro"), "", t("mailRef", { ref: REF }), t("mailMade", { date: longDate(TODAY), list: longDate(R.pricesFrom) }), "",
    t("mailProperty"), kv(t("sumProperty"), c.address)];
  const place = placeText(q);
  if (place) L.push(kv(t("sumPlace"), place));
  if (q.province) L.push(kv(t("provinceLabel"), PROVINCES.find(x => x[0] === q.province)[1]));
  L.push(kv(t("sumType"), ty ? ty.label : ""), "", t("mailAppraisal"), kv(t("sumPurpose"), p ? p.label : ""),
    kv(t("sumEffective"), effectiveText()), kv(t("sumUse"), c.use), kv(t("sumUsers"), c.users || t("usersNone")));
  if (R.rush) L.push(kv(t("sumRush"), sel.rush ? t("yes") + " (" + R.rush.turnaround + ")" : t("no")));
  if (R.complex) L.push(kv(t("sumComplex"), sel.complex ? t("yes") : t("no")));
  L.push("");
  if (q.status === "priced") {
    L.push(t("mailPrice"));
    for (const [k, v] of priceRows(q)) L.push(kv(k, v));
  } else if (q.status === "confirm") {
    L.push(t("mailPriceConfirm", { hours: R.confirmHours }));
    for (const x of q.confirm) L.push("- " + t("conf_" + x.code, x));
  }
  L.push("", t("mailClient"), kv(t("sumClient"), c.name), kv(t("mailEmail"), c.email),
    kv(t("mailPhone"), c.phone), kv(t("sumLawyer"), c.lawyer || t("none")));
  if (R.terms && who.terms) L.push("", t("mailTerms"));
  const subject = cutText(t("mailSubject", { ref: REF, address: c.address || "" }), 140);
  return { subject, body: L, clean: c, quote: q };
}

/** The mailto: link. Half a surrogate pair can't reach here (clean() strips them and readRules() refuses them), but
    encodeURIComponent throws on one, so any that did would become U+FFFD instead of leaving the link unbuilt. */
function mailtoHref(m) {
  const enc = s => encodeURIComponent(fixSurrogates(s, "\ufffd"));
  return "mailto:" + RULES.firm.email + "?subject=" + enc(m.subject) + "&body=" + enc(m.body.join("\r\n"));
}

/** Keep the button's own link current (for a long press or "copy link"). If it can't be built, it points nowhere
    rather than at an older request. */
function refreshMail() {
  const a = $("request");
  if (!a) return;
  try { a.setAttribute("href", mailtoHref(mailParts())); } catch (e) { a.setAttribute("href", "#"); }
}

/** After a request, any change to an answer or a field makes the steps and the summary describe a request that was
    not sent (an old price, an old deposit, or a deposit on what is now a "we'll confirm"). Hide them and say so by
    the button, until the client presses it again. */
function answersChanged() {
  const next = $("next");
  if (!next || next.hidden) return;
  next.hidden = true;
  fill(next);
  const s = $("summary");
  s.hidden = true;
  fill(s);
  $("changed").hidden = false;
}

function fieldErrors(c) {
  const errs = [];
  if (current().status === "incomplete") errs.push(["quote", t("err_quote")]);
  for (const f of FIELDS) {
    const raw = String(who[f.id] || "");
    const v = c[f.id];
    if (clean(raw).length > f.max) errs.push([f.id, t("err_long", { max: f.max })]);
    else if (!f.optional && !v) errs.push([f.id, t("err_" + f.id)]);
    else if (f.id === "email" && !isEmail(v)) errs.push([f.id, t("err_email")]);
    else if (f.id === "phone" && !isPhone(v)) errs.push([f.id, t("err_phone")]);
  }
  if (RULES.terms && !who.terms) errs.push(["terms", t("err_terms")]);
  return errs;
}

function clearFieldError(id) {
  const e = $("e-" + id), f = $("f-" + id);
  if (e) { e.hidden = true; e.textContent = ""; }
  if (f) f.removeAttribute("aria-invalid");
}

function onRequest(ev) {
  // Navigate only once the request is checked and its link is built, so a failure can never open an older request.
  ev.preventDefault();
  $("changed").hidden = true;
  const m = mailParts();
  const errs = fieldErrors(m.clean);
  for (const f of FIELDS) clearFieldError(f.id);
  clearFieldError("terms");
  const box = $("errbox");
  if (errs.length) {
    for (const [id, msg] of errs) {
      const e = $("e-" + id), f = $("f-" + id);
      if (e) { e.textContent = msg; e.hidden = false; }
      if (f) f.setAttribute("aria-invalid", "true");
    }
    fill(box, el("p", { text: errs.length === 1 ? t("errOne") : t("errMany") }),
      el("ul", null, errs.map(([id, msg]) => el("li", null, id === "quote" ? el("a", { href: "#quote", text: msg }) : el("a", { href: "#f-" + id, text: msg })))));
    box.hidden = false;
    box.focus();
    return;
  }
  box.hidden = true;
  let href = "";
  try { href = mailtoHref(m); } catch (e) { href = ""; }
  ev.currentTarget.setAttribute("href", href || "#");
  // The email is the request itself, so it opens even if drawing the next steps fails.
  try { showNext(m, href); } finally { if (href) window.location.href = href; }
}

// ------------------------------------------------------------------ after the request

function copyText(text, input) {
  const done = ok => toast(ok ? t("copied") : t("copyFailed"));
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => done(true), () => done(fallback()));
  } else done(fallback());
  function fallback() {
    if (!input) return false;
    input.focus();
    input.select();
    try { return document.execCommand("copy"); } catch (e) { return false; }
  }
}

let toastTimer = 0;
function toast(msg) {
  const s = $("status");
  s.textContent = msg;
  s.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => s.classList.remove("show"), 2200);
}

/** The next steps. Without `href` (the email link could not be built) there is no "open again" button, and the
    copy-the-request box is the way to send it. */
function showNext(m, href) {
  const R = RULES, q = m.quote, next = $("next");
  const plain = [t("mailCopyTo", { email: R.firm.email }), t("mailCopySubject", { subject: m.subject }), ""].concat(m.body).join("\n");
  const area = el("textarea", { class: "textarea mailtext", readonly: true, "aria-label": t("copyRequest") });
  area.value = plain;
  let n = 0;
  const num = () => el("span", { class: "n", "aria-hidden": "true", text: String(++n) });

  const step1 = el("li", null, el("h3", null, num(), t("step1")), el("p", { text: href ? t("step1Body") : t("noLink", { email: R.firm.email }) }),
    el("div", { class: "btn-row" }, href ? el("a", { class: "btn", href, text: t("openAgain") }) : null,
      el("button", { class: "btn", type: "button", onclick: () => copyText(plain, area), text: t("copyRequest") })),
    href ? el("p", { text: t("noApp", { email: R.firm.email }) }) : null, area);

  let step2;
  if (q.status === "confirm") {
    step2 = el("li", null, el("h3", null, num(), t("step2Wait")), el("p", { text: t("step2WaitBody", { hours: R.confirmHours }) }));
  } else if (R.deposit.mode === "none" || q.deposit <= 0) {
    step2 = el("li", null, el("h3", null, num(), t("step2None")), el("p", { text: t("step2NoneBody") }));
  } else {
    const box = el("div", { class: "paybox" });
    const refCode = el("code", { text: REF });
    if (R.payment.etransfer) {
      const em = el("code", { text: R.payment.etransfer });
      box.append(el("p", { text: t("payEtransfer") }),
        el("div", { class: "copyline" }, em, el("button", { class: "btn btn-sm", type: "button", onclick: () => copyText(R.payment.etransfer), text: t("copyEmail") })),
        el("p", { text: t("payMessage") }),
        el("div", { class: "copyline" }, refCode, el("button", { class: "btn btn-sm", type: "button", onclick: () => copyText(REF), text: t("copyEmail") })));
    }
    if (R.payment.link) {
      const host = new URL(R.payment.link).host;
      if (R.payment.etransfer) box.append(el("p", { text: t("payOr") }));
      else box.append(el("p", { text: t("payRefLink") }), el("div", { class: "copyline" }, refCode,
        el("button", { class: "btn btn-sm", type: "button", onclick: () => copyText(REF), text: t("copyEmail") })));
      box.append(el("div", null, el("a", { class: "btn btn-primary", id: "paylink", href: R.payment.link, target: "_blank", rel: "noopener noreferrer", text: t("payLink") })),
        el("p", { class: "hint", text: t("payLinkHost", { host }) }));
    }
    if (R.payment.note) box.append(el("p", { class: "hint", text: R.payment.note }));
    step2 = el("li", null, el("h3", null, num(), t("step2Pay", { amount: money(q.deposit) })), box);
  }
  const step3 = el("li", null, el("h3", null, num(), t("step3")), el("p", { text: t("step3Body") }),
    el("div", { class: "btn-row" }, el("button", { class: "btn", type: "button", onclick: () => window.print(), text: t("printBtn") })));

  fill(next, el("h2", { class: "h2", id: "l-next", tabindex: "-1", text: t("nextHeading") }), el("ol", { class: "steps" }, step1, step2, step3));
  next.hidden = false;
  renderSummary(m);
  $("l-next").focus();
}

function renderSummary(m) {
  const R = RULES, q = m.quote, c = m.clean;
  const p = R.purposes.find(x => x.id === sel.purpose), ty = R.types.find(x => x.id === sel.type);
  const rows = [[t("sumFirm"), R.firm.name + (R.firm.phone ? " \u00b7 " + R.firm.phone : "") + " \u00b7 " + R.firm.email],
    [t("sumRef"), REF], [t("sumDate"), longDate(TODAY)],
    [t("sumClient"), c.name + " \u00b7 " + c.email + " \u00b7 " + c.phone],
    [t("sumProperty"), c.address], [t("sumPlace"), placeText(q)], [t("sumType"), ty.label], [t("sumPurpose"), p.label],
    [t("sumEffective"), effectiveText()], [t("sumUse"), c.use], [t("sumUsers"), c.users || t("usersNone")],
    [t("sumLawyer"), c.lawyer || t("none")]];
  if (R.rush) rows.push([t("sumRush"), sel.rush ? t("yes") + " (" + R.rush.turnaround + ")" : t("no")]);
  if (R.complex) rows.push([t("sumComplex"), sel.complex ? t("yes") : t("no")]);
  rows.push([t("sumTurnaround"), sel.rush && R.rush ? R.rush.turnaround : R.turnaround]);
  const price = q.status === "priced"
    ? el("table", { class: "lines num" }, el("tbody", null, priceRows(q).map(([k, v, cls]) => el("tr", { class: cls || null }, el("th", { scope: "row", text: k }), el("td", { text: v })))))
    : el("p", { class: "why", text: t("priceToConfirm", { hours: R.confirmHours }) });
  const s = $("summary");
  fill(s, el("h2", { class: "h2", id: "l-summary", text: t("sumHeading") + ": " + R.firm.name }),
    el("dl", { class: "sumgrid" }, rows.map(([k, v]) => [el("dt", { text: k }), el("dd", { text: v })])),
    el("h3", { class: "why", text: t("sumPrice") }), price,
    R.terms ? [el("h3", { class: "why", text: t("sumTerms") }), termsBody()] : null,
    el("p", { class: "sumnote", text: t("sumNote") }));
  s.hidden = false;
}

boot();
</script>
