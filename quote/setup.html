<title>Quote Page Setup</title>
<style>
/* Field Office tokens, copied from fieldoffice/web/static/app.css (via tools/compgrid). Keep in step with that file. */
:root {
  color-scheme: light;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #f5f4f0; --surface: #ffffff; --surface-2: #fbfaf8; --sunken: #efede8; --hover: #f3f1ec;
  --border: #e5e2db; --border-strong: #d3cfc5;
  --text: #1b1f1e; --text-2: #4b5350; --text-3: #626a66;
  --accent: #0f6e6a; --accent-hover: #0b5c58; --accent-text: #0b5f5b; --accent-soft: #e2f0ee; --accent-soft-2: #cfe6e3; --on-accent: #ffffff;
  --ok: #1f7a4a; --ok-soft: #e4f3ea;
  --soon: #96560a; --soon-soft: #fcefd9;
  --late: #b8322a; --late-soft: #fbe6e3;
  --shadow-1: 0 1px 2px rgba(28, 25, 20, 0.05), 0 1px 1px rgba(28, 25, 20, 0.03);
  --ring: 0 0 0 2px var(--surface), 0 0 0 4px rgba(15, 110, 106, 0.55);
  --r-sm: 8px; --r: 10px; --r-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111413; --surface: #191d1c; --surface-2: #1d2221; --sunken: #0d100f; --hover: #222827;
    --border: #2a302e; --border-strong: #3a4240;
    --text: #e9ecea; --text-2: #b6bebb; --text-3: #8f9894;
    --accent: #2fa59d; --accent-hover: #3bb8b0; --accent-text: #6fd1c9; --accent-soft: rgba(63, 181, 173, 0.13); --accent-soft-2: rgba(63, 181, 173, 0.22); --on-accent: #062321;
    --ok: #5fcb8e; --ok-soft: rgba(80, 200, 130, 0.12);
    --soon: #f0b65a; --soon-soft: rgba(240, 175, 70, 0.13);
    --late: #f4847a; --late-soft: rgba(240, 110, 100, 0.13);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --ring: 0 0 0 2px var(--surface), 0 0 0 4px rgba(69, 189, 180, 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111413; --surface: #191d1c; --surface-2: #1d2221; --sunken: #0d100f; --hover: #222827;
  --border: #2a302e; --border-strong: #3a4240;
  --text: #e9ecea; --text-2: #b6bebb; --text-3: #8f9894;
  --accent: #2fa59d; --accent-hover: #3bb8b0; --accent-text: #6fd1c9; --accent-soft: rgba(63, 181, 173, 0.13); --accent-soft-2: rgba(63, 181, 173, 0.22); --on-accent: #062321;
  --ok: #5fcb8e; --ok-soft: rgba(80, 200, 130, 0.12);
  --soon: #f0b65a; --soon-soft: rgba(240, 175, 70, 0.13);
  --late: #f4847a; --late-soft: rgba(240, 110, 100, 0.13);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
  --ring: 0 0 0 2px var(--surface), 0 0 0 4px rgba(69, 189, 180, 0.7);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { box-shadow: var(--ring); border-radius: var(--r-sm); }
.muted { color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; min-width: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.brand small { font-weight: 500; color: var(--text-3); font-size: 12.5px; }
.top .grow { flex: 1; }
.dirty { font-size: 12.5px; font-weight: 650; color: var(--soon); background: var(--soon-soft); padding: 3px 8px; border-radius: 999px; }
.privacy { padding: 10px 16px; background: var(--accent-soft); color: var(--accent-text); border-bottom: 1px solid var(--accent-soft-2); font-weight: 600; }
.privacy span { font-weight: 500; color: var(--text-2); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; max-width: 1480px; margin: 0 auto; padding: 20px 16px 64px; }
@media (min-width: 1180px) { .layout { grid-template-columns: minmax(0, 1fr) 430px; } .pv { position: sticky; top: 72px; align-self: start; } }
.intro h1 { font-size: 22px; }
.intro p { color: var(--text-2); margin-top: 6px; max-width: 760px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1); margin-top: 16px; }
.panel > h2 { font-size: 16px; padding: 16px 18px 0; display: flex; gap: 10px; align-items: center; }
.step { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: inline-grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
.panel-sub { padding: 4px 18px 0; color: var(--text-3); }
.panel-body { padding: 12px 18px 18px; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; margin-top: 10px; }
.field > label, .lbl { font-size: 12.5px; font-weight: 650; color: var(--text-2); }
.hint { color: var(--text-3); font-size: 12.5px; }
.input, .select, .textarea { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); font-size: 14px; min-width: 0; }
.textarea { height: auto; min-height: 96px; padding: 8px 10px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft-2); }
[aria-invalid="true"] { border-color: var(--late) !important; background: var(--late-soft); }
.ferr { color: var(--late); font-size: 12.5px; font-weight: 600; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 32px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
.offer { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; margin-top: 8px; }
.cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.sub-h { font-size: 13.5px; font-weight: 650; margin-top: 16px; }
.sub-h:first-child { margin-top: 0; }
.colour { display: flex; gap: 8px; align-items: center; }
.colour input[type="color"] { width: 44px; height: 38px; padding: 2px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); flex: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file-btn:focus-within { box-shadow: var(--ring); }
.note { margin-top: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--sunken); color: var(--text-2); }
.note.warn { background: var(--soon-soft); color: var(--soon); font-weight: 600; }
.note.bad { background: var(--late-soft); color: var(--late); font-weight: 600; }
.note.good { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.note button.linkish { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; font-weight: 600; text-align: left; }

.grid-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); margin-top: 10px; }
table.fees { border-collapse: separate; border-spacing: 0; min-width: 100%; }
table.fees th, table.fees td { padding: 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
table.fees thead th { font-size: 12px; font-weight: 650; color: var(--text-2); background: var(--surface-2); min-width: 92px; }
table.fees tbody th { position: sticky; left: 0; background: var(--surface); font-weight: 600; min-width: 150px; max-width: 200px; z-index: 1; }
table.fees td .input { width: 92px; text-align: right; }
table.fees tr:last-child th, table.fees tr:last-child td { border-bottom: 0; }
table.fees tbody th span { display: block; }
.copydown { height: 24px; padding: 0 6px; margin: 2px 0 0 -6px; font-size: 11.5px; font-weight: 600; color: var(--accent-text); }
.money { position: relative; display: inline-block; }
.zone, .band, .taxbox { border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; margin-top: 10px; background: var(--surface-2); }
.zone-top, .band-row, .tax-row { display: grid; gap: 10px; align-items: end; }
.zone-top { grid-template-columns: minmax(0, 1fr) 120px auto; }
.band-row { grid-template-columns: 120px 120px auto; }
.tax-row { grid-template-columns: minmax(0, 1fr) 110px auto; }
.provs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 12px; margin-top: 6px; }

.pv { min-width: 0; }
.pv-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pv-head h2 { font-size: 15px; }
.pv-frame { margin-top: 10px; border: 1px solid var(--border-strong); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); height: min(860px, 80vh); }
.pv-frame.phone { width: 390px; max-width: 100%; }
.pv-frame iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
.pv-paused { margin-top: 8px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--border); gap: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); font-weight: 600; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); z-index: 50; }
.toast.show { opacity: 1; }
.toast.err { background: var(--late); color: #fff; }
@media (max-width: 640px) {
  .zone-top { grid-template-columns: minmax(0, 1fr) 100px; }
  .zone-top > :last-child { grid-column: 1 / -1; justify-self: start; }
  .tax-row { grid-template-columns: minmax(0, 1fr) 90px; }
  .tax-row > :last-child { grid-column: 1 / -1; justify-self: start; }
  .band-row { grid-template-columns: 1fr 1fr; }
  .band-row > :last-child { grid-column: 1 / -1; justify-self: start; }
  .pv-frame { height: 640px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true">$</span><span>Quote page setup <small>Field Office</small></span></div>
  <span class="grow"></span>
  <span class="dirty" id="dirty" hidden>Unsaved changes</span>
</header>
<div class="privacy">Offline. Nothing you type leaves this computer. <span>You download your quote page and put it on your own website; it sends nothing to us either.</span></div>
<div class="layout">
  <main id="editor" class="ed"></main>
  <aside class="pv" aria-labelledby="pv-title">
    <div class="pv-head">
      <h2 id="pv-title">Preview</h2>
      <span class="grow"></span>
      <div class="seg" role="group" aria-label="Preview width">
        <button type="button" id="pv-phone" aria-pressed="true">Phone</button>
        <button type="button" id="pv-wide" aria-pressed="false">Wide</button>
      </div>
    </div>
    <p class="hint">Your client's page, exactly as it will be. Email and payment links don't open from the preview.</p>
    <div class="note warn pv-paused" id="pv-paused" hidden></div>
    <div class="pv-frame phone" id="pv-box"><iframe id="pv" title="Preview of your quote page" sandbox="allow-scripts"></iframe></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

x; --r-lg: 14px;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --bg: #111413; --surface: #191d1c; --surface-2: #1d2221; --sunken: #0d100f; --hover: #222827;\n    --border: #2a302e; --border-strong: #46504d;\n    --text: #e9ecea; --text-2: #b6bebb; --text-3: #959e9a;\n    --sel: color-mix(in srgb, var(--brand) 45%, #ffffff); --sel-soft: color-mix(in srgb, var(--brand) 22%, var(--surface));\n    --ok: #5fcb8e; --ok-soft: rgba(80, 200, 130, 0.12);\n    --soon: #f0b65a; --soon-soft: rgba(240, 175, 70, 0.13);\n    --late: #f4847a; --late-soft: rgba(240, 110, 100, 0.13);\n    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);\n    --ring: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--brand) 45%, #ffffff);\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --bg: #111413; --surface: #191d1c; --surface-2: #1d2221; --sunken: #0d100f; --hover: #222827;\n  --border: #2a302e; --border-strong: #46504d;\n  --text: #e9ecea; --text-2: #b6bebb; --text-3: #959e9a;\n  --sel: color-mix(in srgb, var(--brand) 45%, #ffffff); --sel-soft: color-mix(in srgb, var(--brand) 22%, var(--surface));\n  --ok: #5fcb8e; --ok-soft: rgba(80, 200, 130, 0.12);\n  --soon: #f0b65a; --soon-soft: rgba(240, 175, 70, 0.13);\n  --late: #f4847a; --late-soft: rgba(240, 110, 100, 0.13);\n  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);\n  --ring: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--brand) 45%, #ffffff);\n}\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nh1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -0.01em; }\np { margin: 0; }\n[hidden] { display: none !important; }\n:focus { outline: none; }\n:focus-visible { box-shadow: var(--ring); border-radius: 6px; }\n.num { font-variant-numeric: tabular-nums; }\n.muted { color: var(--text-3); }\n.skip { position: absolute; left: 16px; top: -60px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 10; }\n.skip:focus { top: 8px; }\n.noscript { max-width: 640px; margin: 24px auto; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }\n\n.top { background: var(--surface); border-bottom: 1px solid var(--border); }\n.top-in { max-width: 720px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }\n.badge { width: 44px; height: 44px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 750; font-size: 16px; letter-spacing: 0.02em; flex: none; overflow: hidden; }\n.firm-name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }\n.firm-area { color: var(--text-3); font-size: 14px; overflow-wrap: anywhere; }\n.sample { background: var(--soon-soft); color: var(--soon); font-weight: 650; font-size: 14px; }\n.sample p { max-width: 720px; margin: 0 auto; padding: 10px 16px; }\n\n.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }\n.lead h1 { font-size: 24px; }\n.lead p { color: var(--text-2); margin-top: 6px; }\n.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 16px; margin-top: 16px; }\nfieldset { border: 0; margin: 0; padding: 0; min-width: 0; }\nlegend, .h2 { font-size: 18px; font-weight: 700; padding: 0; margin-bottom: 12px; display: flex; gap: 10px; align-items: baseline; }\n.n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--sunken); color: var(--text-2); font-size: 14px; font-weight: 700; flex: none; transform: translateY(2px); }\n.opts { display: grid; gap: 8px; grid-template-columns: 1fr; }\n@media (min-width: 560px) { .opts { grid-template-columns: 1fr 1fr; } }\n.opt { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border: 1.5px solid var(--border-strong); border-radius: var(--r); background: var(--surface); cursor: pointer; }\n.opt:hover { background: var(--hover); }\n.opt input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--sel); }\n.opt:has(input:checked) { border-color: var(--sel); background: var(--sel-soft); }\n.opt:has(input:focus-visible) { box-shadow: var(--ring); }\n.opt input:focus-visible { box-shadow: none; }\n.opt .sub { display: block; color: var(--text-3); font-size: 14px; }\n.field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }\n.field label, .field .lbl { font-weight: 650; font-size: 15px; }\n.hint { color: var(--text-3); font-size: 14px; }\n.input, .select, .textarea { width: 100%; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--border-strong); border-radius: var(--r); background: var(--surface); font-size: 16px; }\n.textarea { min-height: 88px; resize: vertical; }\n.input:focus, .select:focus, .textarea:focus { border-color: var(--sel); box-shadow: var(--ring); }\n[aria-invalid=\"true\"] { border-color: var(--late) !important; }\n.ferr { color: var(--late); font-weight: 600; font-size: 14px; }\n.check { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; cursor: pointer; }\n.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--sel); }\n\n.quote { border-width: 2px; }\n.quote.priced { border-color: var(--sel); }\n.quote.confirm { border-color: var(--soon); }\n.quote h2 { font-size: 20px; }\n.quote ul { margin: 8px 0 0; padding-left: 20px; }\n.quote .why { margin-top: 10px; font-weight: 600; }\n.lines { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 16px; }\n.lines th { text-align: left; font-weight: 500; padding: 7px 8px 7px 0; vertical- --soon); font-weight: 600; }\n\n.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }\n.steps h3 { font-size: 18px; display: flex; gap: 10px; align-items: baseline; }\n.steps p { margin-top: 6px; color: var(--text-2); }\n.paybox { margin-top: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--border); display: grid; gap: 6px; }\n.copyline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }\n.copyline code { font-family: inherit; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }\n.btn-sm { min-height: 40px; padding: 6px 12px; font-size: 15px; }\n.mailtext { width: 100%; min-height: 220px; margin-top: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }\n.sumgrid { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 14px; margin-top: 12px; font-size: 15px; }\n.sumgrid dt { color: var(--text-3); }\n.sumgrid dd { margin: 0; overflow-wrap: anywhere; }\n.sumnote { margin-top: 12px; color: var(--text-3); font-size: 14px; }\n.foot { margin-top: 28px; color: var(--text-3); font-size: 14px; display: grid; gap: 6px; }\n.foot a { color: inherit; }\n.status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 650; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); }\n.status.show { opacity: 1; }\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }\n@media print {\n  /* Paper is white whatever the screen's theme: the dark tokens would print light grey text. */\n  :root, :root:not([data-theme=\"light\"]), :root[data-theme=\"dark\"] {\n    color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #fff; --sunken: #f2f2f2;\n    --text: #000; --text-2: #222; --text-3: #444; --border: #bbb; --border-strong: #999;\n    --sel: var(--brand); --sel-soft: #eef1f5; --late: #b8322a; --soon: #8a4f08;\n  }\n  body { background: #fff; font-size: 12pt; }\n  .noprint, .skip, .sample, .status { display: none !important; }\n  .card { box-shadow: none; border-color: #999; break-inside: avoid; }\n  .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip\" href=\"#main\">Skip to the questions\u003c/a>\n\u003cnoscript>\u003cp class=\"noscript\" id=\"noscript\">This page needs JavaScript to work out your price.\u003c/p>\u003c/noscript>\n\u003cdiv id=\"app\">\u003c/div>\n\u003cdiv class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cscript type=\"application/json\" id=\"quote-config\">{}\u003c/script>\n\u003cscript>\n\"use strict\";\n/* shared:begin */\n// tools/quote/shared.js: the rules format, its strict reader and the price arithmetic, shared by setup.html and the\n// client quote page. sync.py pastes this file into both pages between the shared markers, so the firm's preview and\n// the client's page can never price differently. Edit this file, then run python3 tools/quote/sync.py.\n// Money is integer cents. Tax rates are integer thousandths of a percent (15000 = 15%, 9975 = 9.975%).\n\nconst QUOTE_FORMAT = \"field-office-quote-rules\";\nconst QUOTE_VERSION = 1;\n\nconst PURPOSE_DEFAULTS = [\n  [\"estate\", \"Estate or date of death\"],\n  [\"separation\", \"Separation or matrimonial\"],\n  [\"tax\", \"Tax or capital gains\"],\n  [\"sale\", \"Private sale\"],\n  [\"lender\", \"Private lender or MIC\"],\n  [\"other\", \"Something else\"],\n];\nconst TYPE_DEFAULTS = [\n  [\"detached\", \"Detached house\"],\n  [\"semi\", \"Semi-detached or townhouse\"],\n  [\"condo\", \"Condo unit\"],\n  [\"multi\", \"2 to 4 units\"],\n  [\"rural\", \"Rural or acreage\"],\n  [\"cottage\", \"Cottage\"],\n  [\"land\", \"Vacant land\"],\n];\n// GST/HST starting values, October 2026. Nova Scotia's HST is 14% from 1 April 2025. Quebec adds QST, worked out on\n// the price before GST. Other provincial sales taxes are not included. The firm checks its own rates.\nconst PROVINCES = [\n  [\"AB\", \"Alberta\", [[\"GST\", 5000]]],\n  [\"BC\", \"British Columbia\", [[\"GST\", 5000]]],\n  [\"MB\", \"Manitoba\", [[\"GST\", 5000]]],\n  [\"NB\", \"New Brunswick\", [[\"HST\", 15000]]],\n  [\"NL\", \"Newfoundland and Labrador\", [[\"HST\", 15000]]],\n  [\"NS\", \"Nova Scotia\", [[\"HST\", 14000]]],\n  [\"NT\", \"Northwest Territories\", [[\"GST\", 5000]]],\n  [\"NU\", \"Nunavut\", [[\"GST\", 5000]]],\n  [\"ON\", \"Ontario\", [[\"HST\", 13000]]],\n  [\"PE\", \"Prince Edward Island\", [[\"HST\", 15000]]],\n  [\"QC\", \"Quebec\", [[\"GST\", 5000], [\"QST\", 9975]]],\n  [\"SK\", \"Saskatchewan\", [[\"GST\", 5000]]],\n  [\"YT\", \"Yukon\", [[\"GST\", 5000]]],\n];\nconst MAX_FEE = 5000000;          // $50,000: any single fee above this is a typing slip\nconst RULES_MAX_BYTES = 300000;   // a rules file or a quote page read back into setup\nconst TOP_KEYS = [\"format\", \"version\", \"sample\", \"firm\", \"pricesFrom\", \"validDays\", \"purposes\", \"types\", \"fees\",\n  \"retro\", \"rush\", \"travel\", \"complex\", \"confirmHours\", \"provinces\", \"tax\", \"deposit\", \"turnaround\", \"payment\", \"terms\"];\n\n// ------------------------------------------------------------------ small pure helpers\n\nfunction isPlainObject(v) {\n  return v !== null && typeof v === \"object\" && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype;\n}\n\n/** The path of the first key named __proto__, constructor or prototype at any depth, or \"\". */\nfunction protoKeyPath(v, path) {\n  if (Array.isArray(v)) {\n    for (let i = 0; i \u003c v.length; i++) { const p = protoKeyPath(v[i], path + \".\" + i); if (p) return p; }\n  } else if (v !== null && typeof v === \"object\") {\n    for (const k of Object.keys(v)) {\n      const here = path ? path + \".\" + k : k;\n      if (k === \"__proto__\" || k === \"constructor\" || k === \"prototype\") return here;\n      const p = protoKeyPath(v[k], here);\n      if (p) return p;\n    }\n  }\n  return \"\";\n}\n\nconst CONTROL_RE = /[\\u0000-\\u0008\\u000b-\\u001f\\u007f-\\u009f\\u200b-\\u200f\\u202a-\\u202e\\u2028\\u2029\\u2066-\\u2069\\ufeff]/;\n// A whole surrogate pair (one character, such as an emoji), else half of one on its own. Half a pair is not a\n// character at all, and encodeURIComponent throws on it, which would leave the request email unbuilt.\nconst SURROGATE_RE = /[\\ud800-\\udbff][\\udc00-\\udfff]|[\\ud800-\\udfff]/g;\nconst LINE_BREAK_RE = /[\\n\\t]/;\nconst EMAIL_RE = /^[A-Za-z0-9._+-]{1,64}@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\\.[A-Za-z]{2,24}$/;\nconst PHONE_RE = /^[0-9 +().-]{7,25}$/;\nconst COLOR_RE = /^#[0-9a-fA-F]{6}$/;\n\n/** `s` with every half pair replaced by `rep`; whole pairs are kept. */\nfunction fixSurrogates(s, rep) { return s.replace(SURROGATE_RE, m => (m.length === 2 ? m : rep)); }\nfunction hasHalfPair(s) { return fixSurrogates(s, \"\") !== s; }\n\n/** At most `n` UTF-16 units of `s`, never ending in half a pair (slice counts units, so it can cut an emoji). */\nfunction cutText(s, n) {\n  const c = s.slice(0, n);\n  return /[\\ud800-\\udbff]$/.test(c) ? c.slice(0, -1) : c;\n}\n\nfunction isEmail(s) {\n  return typeof s === \"string\" && s.length \u003c= 120 && EMAIL_RE.test(s) && !s.includes(\"..\") && !s.startsWith(\".\");\n}\n\n/** A phone number has 7 to 15 digits and only the characters people write numbers with. */\nfunction isPhone(s) {\n  if (typeof s !== \"string\" || !PHONE_RE.test(s)) return false;\n  const d = s.replace(/[^0-9]/g, \"\").length;\n  return d >= 7 && d \u003c= 15;\n}\n\n/** Only an https: link to a named host, written out in full, with no login part. Anything else is refused,\n    so a javascript:, data: or http: link can never become the payment button. Returns the normalised link or \"\". */\nfunction httpsLink(s) {\n  if (typeof s !== \"string\" || s.length > 500 || CONTROL_RE.test(s) || hasHalfPair(s) || /[\\s\\\\\u003c>\"'`]/.test(s)) return \"\";\n  if (!/^https:\\/\\/[A-Za-z0-9]/.test(s)) return \"\";\n  let u;\n  try { u = new URL(s); } catch (e) { return \"\"; }\n  if (u.protocol !== \"https:\" || u.username || u.password || u.port) return \"\";\n  if (!/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*\\.[a-z]{2,24}$/.test(u.hostname)) return \"\";\n  return u.href;\n}\n\nfunction isIsoDate(s) {\n  if (typeof s !== \"string\" || !/^\\d{4}-\\d{2}-\\d{2}$/.test(s)) return false;\n  const y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10);\n  const t = new Date(Date.UTC(y, m - 1, d));\n  return y >= 1900 && t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;\n}\n\nfunction pad2(n) { return String(n).padStart(2, \"0\"); }\n\n/** Today's date where the reader is, as YYYY-MM-DD. */\nfunction localToday(d) {\n  d = d || new Date();\n  return d.getFullYear() + \"-\" + pad2(d.getMonth() + 1) + \"-\" + pad2(d.getDate());\n}\n\n/** The same calendar day `years` years earlier (29 Feb becomes 28 Feb), as YYYY-MM-DD. */\nfunction yearsBefore(iso, years) {\n  const y = +iso.slice(0, 4) - years, m = iso.slice(5, 7);\n  let d = iso.slice(8, 10);\n  if (m === \"02\" && d === \"29\" && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) d = \"28\";\n  return String(y).padStart(4, \"0\") + \"-\" + m + \"-\" + d;\n}\n\n/** a / b rounded half up, for non-negative integers (tax and deposit cents). */\nfunction roundDiv(a, b) { return Math.floor((2 * a + b) / (2 * b)); }\n\nfunction money(cents) {\n  const neg = cents \u003c 0;\n  const c = Math.abs(cents);\n  const dollars = String(Math.floor(c / 100)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, \",\");\n  return (neg ? \"-\" : \"\") + \"$\" + dollars + \".\" + pad2(c % 100);\n}\n\n/** 15000 -> \"15%\", 9975 -> \"9.975%\". */\nfunction ratePercent(rate) {\n  const whole = Math.floor(rate / 1000), frac = String(rate % 1000).padStart(3, \"0\").replace(/0+$/, \"\");\n  return whole + (frac ? \".\" + frac : \"\") + \"%\";\n}\n\n/** Relative luminance contrast of a #rrggbb colour against white. */\nfunction contrastWithWhite(hex) {\n  const ch = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)\n    .map(c => (c \u003c= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));\n  const lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];\n  return 1.05 / (lum + 0.05);\n}\n\n// ------------------------------------------------------------------ the strict reader\n\n/** Read a rules object as untrusted data. Returns {rules, errors}: `rules` is the canonical copy (key order fixed,\n    text trimmed, the link normalised) when there are no errors, else null. Every problem is named by its path. */\nfunction readRules(raw) {\n  const errors = [];\n  const bad = (path, msg) => { errors.push({ path, msg }); };\n  if (!isPlainObject(raw)) return { rules: null, errors: [{ path: \"\", msg: \"The rules must be one JSON object.\" }] };\n  const proto = protoKeyPath(raw, \"\");\n  if (proto) return { rules: null, errors: [{ path: proto, msg: \"A key named __proto__, constructor or prototype is not allowed.\" }] };\n\n  const keysOf = (obj, path, allowed, optional) => {\n    if (!isPlainObject(obj)) { bad(path, \"Must be a group of settings.\"); return false; }\n    for (const k of Object.keys(obj)) if (!allowed.includes(k)) bad(path ? path + \".\" + k : k, \"Unknown setting.\");\n    for (const k of allowed) if (!(k in obj) && !(optional || []).includes(k)) bad(path ? path + \".\" + k : k, \"Missing.\");\n    return true;\n  };\n  const line = (v, path, min, max) => {\n    if (typeof v !== \"string\") { bad(path, \"Must be text.\"); return \"\"; }\n    const s = v.trim();\n    if (CONTROL_RE.test(s) || hasHalfPair(s) || LINE_BREAK_RE.test(s) || /\\r/.test(s)) bad(path, \"Must be one line of plain text.\");\n    else if (s.length \u003c min) bad(path, min === 1 ? \"Required.\" : \"Needs at least \" + min + \" characters.\");\n    else if (s.length > max) bad(path, \"Too long: at most \" + max + \" characters.\");\n    return s;\n  };\n  const text = (v, path, max) => {\n    if (typeof v !== \"string\") { bad(path, \"Must be text.\"); return \"\"; }\n    const s = v.replace(/\\r\\n?/g, \"\\n\").replace(/[ \\t]+$/gm, \"\").trim();\n    if (CONTROL_RE.test(s) || hasHalfPair(s) || /\\t/.test(s)) bad(path, \"Must be plain text.\");\n    else if (s.length > max) bad(path, \"Too long: at most \" + max + \" characters.\");\n    return s;\n  };\n  const int = (v, path, min, max, what) => {\n    if (typeof v !== \"number\" || !Number.isInteger(v)) { bad(path, \"Must be a whole number\" + (what ? \" (\" + what + \")\" : \"\") + \".\"); return 0; }\n    if (v \u003c min || v > max) bad(path, \"Must be from \" + min + \" to \" + max + (what ? \" \" + what : \"\") + \".\");\n    return v;\n  };\n  const cents = (v, path, min, max) => {\n    if (typeof v !== \"number\" || !Number.isInteger(v)) { bad(path, \"Must be an amount in whole cents.\"); return 0; }\n    if (v \u003c min || v > max) bad(path, \"Must be from \" + money(min) + \" to \" + money(max) + \".\");\n    return v;\n  };\n\n  keysOf(raw, \"\", TOP_KEYS, [\"sample\", \"rush\", \"complex\"]);\n  const out = {};\n  if (raw.format !== QUOTE_FORMAT) bad(\"format\", \"Not a quote rules file (format line missing).\");\n  if (raw.version !== QUOTE_VERSION) bad(\"version\", \"Version \" + QUOTE_VERSION + \" is the only version this page reads.\");\n  out.format = QUOTE_FORMAT;\n  out.version = QUOTE_VERSION;\n  if (\"sample\" in raw) {\n    const s = line(raw.sample, \"sample\", 0, 300);\n    if (s) out.sample = s;\n  }\n\n  const f = raw.firm, firm = {};\n  if (keysOf(f, \"firm\", [\"name\", \"logoText\", \"color\", \"email\", \"phone\", \"area\"])) {\n    firm.name = line(f.name, \"firm.name\", 1, 80);\n    firm.logoText = line(f.logoText, \"firm.logoText\", 1, 4);\n    firm.color = typeof f.color === \"string\" ? f.color.toLowerCase() : f.color;\n    if (!COLOR_RE.test(String(f.color))) bad(\"firm.color\", \"Must be a colour written like #1d4f91.\");\n    else if (contrastWithWhite(firm.color) \u003c 4.5) bad(\"firm.color\", \"Too light: white text on it would be hard to read. Pick a darker colour.\");\n    firm.email = line(f.email, \"firm.email\", 1, 120);\n    if (firm.email && !isEmail(firm.email)) bad(\"firm.email\", \"Not an email address.\");\n    firm.phone = line(f.phone, \"firm.phone\", 0, 25);\n    if (firm.phone && !isPhone(firm.phone)) bad(\"firm.phone\", \"Not a phone number (digits, spaces, + - ( ) . only).\");\n    firm.area = line(f.area, \"firm.area\", 0, 120);\n  }\n  out.firm = firm;\n  out.pricesFrom = raw.pricesFrom;\n  if (!isIsoDate(raw.pricesFrom)) bad(\"pricesFrom\", \"Must be a date written YYYY-MM-DD.\");\n  out.validDays = int(raw.validDays, \"validDays\", 1, 365, \"days\");\n\n  const list = (arr, path, defaults, what) => {\n    const res = [];\n    if (!Array.isArray(arr) || arr.length \u003c 1 || arr.length > defaults.length) { bad(path, \"Offer at least one \" + what + \".\"); return res; }\n    const ids = defaults.map(d => d[0]), seen = new Set();\n    arr.forEach((x, i) => {\n      const p = path + \".\" + i;\n      if (!keysOf(x, p, [\"id\", \"label\"])) return;\n      if (!ids.includes(x.id) || seen.has(x.id)) { bad(p + \".id\", \"Unknown or repeated \" + what + \".\"); return; }\n      seen.add(x.id);\n      res.push({ id: x.id, label: line(x.label, p + \".label\", 1, 60) });\n    });\n    return res;\n  };\n  out.purposes = list(raw.purposes, \"purposes\", PURPOSE_DEFAULTS, \"purpose\");\n  out.types = list(raw.types, \"types\", TYPE_DEFAULTS, \"property type\");\n\n  const fees = {};\n  if (keysOf(raw.fees, \"fees\", out.purposes.map(p => p.id))) {\n    for (const p of out.purposes) {\n      const row = raw.fees[p.id], r = {};\n      if (keysOf(row   ["NS", "Nova Scotia", [["HST", 14000]]],
  ["NT", "Northwest Territories", [["GST", 5000]]],
  ["NU", "Nunavut", [["GST", 5000]]],
  ["ON", "Ontario", [["HST", 13000]]],
  ["PE", "Prince Edward Island", [["HST", 15000]]],
  ["QC", "Quebec", [["GST", 5000], ["QST", 9975]]],
  ["SK", "Saskatchewan", [["GST", 5000]]],
  ["YT", "Yukon", [["GST", 5000]]],
];
const MAX_FEE = 5000000;          // $50,000: any single fee above this is a typing slip
const RULES_MAX_BYTES = 300000;   // a rules file or a quote page read back into setup
const TOP_KEYS = ["format", "version", "sample", "firm", "pricesFrom", "validDays", "purposes", "types", "fees",
  "retro", "rush", "travel", "complex", "confirmHours", "provinces", "tax", "deposit", "turnaround", "payment", "terms"];

// ------------------------------------------------------------------ small pure helpers

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype;
}

/** The path of the first key named __proto__, constructor or prototype at any depth, or "". */
function protoKeyPath(v, path) {
  if (Array.isArray(v)) {
    for (let i = 0; i < v.length; i++) { const p = protoKeyPath(v[i], path + "." + i); if (p) return p; }
  } else if (v !== null && typeof v === "object") {
    for (const k of Object.keys(v)) {
      const here = path ? path + "." + k : k;
      if (k === "__proto__" || k === "constructor" || k === "prototype") return here;
      const p = protoKeyPath(v[k], here);
      if (p) return p;
    }
  }
  return "";
}

const CONTROL_RE = /[\u0000-\u0008\u000b-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2028\u2029\u2066-\u2069\ufeff]/;
// A whole surrogate pair (one character, such as an emoji), else half of one on its own. Half a pair is not a
// character at all, and encodeURIComponent throws on it, which would leave the request email unbuilt.
const SURROGATE_RE = /[\ud800-\udbff][\udc00-\udfff]|[\ud800-\udfff]/g;
const LINE_BREAK_RE = /[\n\t]/;
const EMAIL_RE = /^[A-Za-z0-9._+-]{1,64}@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.[A-Za-z]{2,24}$/;
const PHONE_RE = /^[0-9 +().-]{7,25}$/;
const COLOR_RE = /^#[0-9a-fA-F]{6}$/;

/** `s` with every half pair replaced by `rep`; whole pairs are kept. */
function fixSurrogates(s, rep) { return s.replace(SURROGATE_RE, m => (m.length === 2 ? m : rep)); }
function hasHalfPair(s) { return fixSurrogates(s, "") !== s; }

/** At most `n` UTF-16 units of `s`, never ending in half a pair (slice counts units, so it can cut an emoji). */
function cutText(s, n) {
  const c = s.slice(0, n);
  return /[\ud800-\udbff]$/.test(c) ? c.slice(0, -1) : c;
}

function isEmail(s) {
  return typeof s === "string" && s.length <= 120 && EMAIL_RE.test(s) && !s.includes("..") && !s.startsWith(".");
}

/** A phone number has 7 to 15 digits and only the characters people write numbers with. */
function isPhone(s) {
  if (typeof s !== "string" || !PHONE_RE.test(s)) return false;
  const d = s.replace(/[^0-9]/g, "").length;
  return d >= 7 && d <= 15;
}

/** Only an https: link to a named host, written out in full, with no login part. Anything else is refused,
    so a javascript:, data: or http: link can never become the payment button. Returns the normalised link or "". */
function httpsLink(s) {
  if (typeof s !== "string" || s.length > 500 || CONTROL_RE.test(s) || hasHalfPair(s) || /[\s\\<>"'`]/.test(s)) return "";
  if (!/^https:\/\/[A-Za-z0-9]/.test(s)) return "";
  let u;
  try { u = new URL(s); } catch (e) { return ""; }
  if (u.protocol !== "https:" || u.username || u.password || u.port) return "";
  if (!/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*\.[a-z]{2,24}$/.test(u.hostname)) return "";
  return u.href;
}

function isIsoDate(s) {
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10);
  const t = new Date(Date.UTC(y, m - 1, d));
  return y >= 1900 && t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}

function pad2(n) { return String(n).padStart(2, "0"); }

/** Today's date where the reader is, as YYYY-MM-DD. */
function localToday(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

/** The same calendar day `years` years earlier (29 Feb becomes 28 Feb), as YYYY-MM-DD. */
function yearsBefore(iso, years) {
  const y = +iso.slice(0, 4) - years, m = iso.slice(5, 7);
  let d = iso.slice(8, 10);
  if (m === "02" && d === "29" && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) d = "28";
  return String(y).padStart(4, "0") + "-" + m + "-" + d;
}

/** a / b rounded half up, for non-negative integers (tax and deposit cents). */
function roundDiv(a, b) { return Math.floor((2 * a + b) / (2 * b)); }

function money(cents) {
  const neg = cents < 0;
  const c = Math.abs(cents);
  const dollars = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + "$" + dollars + "." + pad2(c % 100);
}

/** 15000 -> "15%", 9975 -> "9.975%". */
function ratePercent(rate) {
  const whole = Math.floor(rate / 1000), frac = String(rate % 1000).padStart(3, "0").replace(/0+$/, "");
  return whole + (frac ? "." + frac : "") + "%";
}

/** Relative luminance contrast of a #rrggbb colour against white. */
function contrastWithWhite(hex) {
  const ch = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  const lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  return 1.05 / (lum + 0.05);
}

// ------------------------------------------------------------------ the strict reader

/** Read a rules object as untrusted data. Returns {rules, errors}: `rules` is the canonical copy (key order fixed,
    text trimmed, the link normalised) when there are no errors, else null. Every problem is named by its path. */
function readRules(raw) {
  const errors = [];
  const bad = (path, msg) => { errors.push({ path, msg }); };
  if (!isPlainObject(raw)) return { rules: null, errors: [{ path: "", msg: "The rules must be one JSON object." }] };
  const proto = protoKeyPath(raw, "");
  if (proto) return { rules: null, errors: [{ path: proto, msg: "A key named __proto__, constructor or prototype is not allowed." }] };

  const keysOf = (obj, path, allowed, optional) => {
    if (!isPlainObject(obj)) { bad(path, "Must be a group of settings."); return false; }
    for (const k of Object.keys(obj)) if (!allowed.includes(k)) bad(path ? path + "." + k : k, "Unknown setting.");
    for (const k of allowed) if (!(k in obj) && !(optional || []).includes(k)) bad(path ? path + "." + k : k, "Missing.");
    return true;
  };
  const line = (v, path, min, max) => {
    if (typeof v !== "string") { bad(path, "Must be text."); return ""; }
    const s = v.trim();
    if (CONTROL_RE.test(s) || hasHalfPair(s) || LINE_BREAK_RE.test(s) || /\r/.test(s)) bad(path, "Must be one line of plain text.");
    else if (s.length < min) bad(path, min === 1 ? "Required." : "Needs at least " + min + " characters.");
    else if (s.length > max) bad(path, "Too long: at most " + max + " characters.");
    return s;
  };
  const text = (v, path, max) => {
    if (typeof v !== "string") { bad(path, "Must be text."); return ""; }
    const s = v.replace(/\r\n?/g, "\n").replace(/[ \t]+$/gm, "").trim();
    if (CONTROL_RE.test(s) || hasHalfPair(s) || /\t/.test(s)) bad(path, "Must be plain text.");
    else if (s.length > max) bad(path, "Too long: at most " + max + " characters.");
    return s;
  };
  const int = (v, path, min, max, what) => {
    if (typeof v !== "number" || !Number.isInteger(v)) { bad(path, "Must be a whole number" + (what ? " (" + what + ")" : "") + "."); return 0; }
    if (v < min || v > max) bad(path, "Must be from " + min + " to " + max + (what ? " " + what : "") + ".");
    return v;
  };
  const cents = (v, path, min, max) => {
    if (typeof v !== "number" || !Number.isInteger(v)) { bad(path, "Must be an amount in whole cents."); return 0; }
    if (v < min || v > max) bad(path, "Must be from " + money(min) + " to " + money(max) + ".");
    return v;
  };

  keysOf(raw, "", TOP_KEYS, ["sample", "rush", "complex"]);
  const out = {};
  if (raw.format !== QUOTE_FORMAT) bad("format", "Not a quote rules file (format line missing).");
  if (raw.version !== QUOTE_VERSION) bad("version", "Version " + QUOTE_VERSION + " is the only version this page reads.");
  out.format = QUOTE_FORMAT;
  out.version = QUOTE_VERSION;
  if ("sample" in raw) {
    const s = line(raw.sample, "sample", 0, 300);
    if (s) out.sample = s;
  }

  const f = raw.firm, firm = {};
  if (keysOf(f, "firm", ["name", "logoText", "color", "email", "phone", "area"])) {
    firm.name = line(f.name, "firm.name", 1, 80);
    firm.logoText = line(f.logoText, "firm.logoText", 1, 4);
    firm.color = typeof f.color === "string" ? f.color.toLowerCase() : f.color;
    if (!COLOR_RE.test(String(f.color))) bad("firm.color", "Must be a colour written like #1d4f91.");
    else if (contrastWithWhite(firm.color) < 4.5) bad("firm.color", "Too light: white text on it would be hard to read. Pick a darker colour.");
    firm.email = line(f.email, "firm.email", 1, 120);
    if (firm.email && !isEmail(firm.email)) bad("firm.email", "Not an email address.");
    firm.phone = line(f.phone, "firm.phone", 0, 25);
    if (firm.phone && !isPhone(firm.phone)) bad("firm.phone", "Not a phone number (digits, spaces, + - ( ) . only).");
    firm.area = line(f.area, "firm.area", 0, 120);
  }
  out.firm = firm;
  out.pricesFrom = raw.pricesFrom;
  if (!isIsoDate(raw.pricesFrom)) bad("pricesFrom", "Must be a date written YYYY-MM-DD.");
  out.validDays = int(raw.validDays, "validDays", 1, 365, "days");

  const list = (arr, path, defaults, what) => {
    const res = [];
    if (!Array.isArray(arr) || arr.length < 1 || arr.length > defaults.length) { bad(path, "Offer at least one " + what + "."); return res; }
    const ids = defaults.map(d => d[0]), seen = new Set();
    arr.forEach((x, i) => {
      const p = path + "." + i;
      if (!keysOf(x, p, ["id", "label"])) return;
      if (!ids.includes(x.id) || seen.has(x.id)) { bad(p + ".id", "Unknown or repeated " + what + "."); return; }
      seen.add(x.id);
      res.push({ id: x.id, label: line(x.label, p + ".label", 1, 60) });
    });
    return res;
  };
  out.purposes = list(raw.purposes, "purposes", PURPOSE_DEFAULTS, "purpose");
  out.types = list(raw.types, "types", TYPE_DEFAULTS, "property type");

  const fees = {};
  if (keysOf(raw.fees, "fees", out.purposes.map(p => p.id))) {
    for (const p of out.purposes) {
      const row = raw.fees[p.id], r = {};
      if (keysOf(row, "fees." + p.id, out.types.map(t => t.id))) {
        for (const t of out.types) {
          const v = row[t.id], path = "fees." + p.id + "." + t.id;
          r[t.id] = v === null ? null : cents(v, path, 100, MAX_FEE);
        }
      }
      fees[p.id] = r;
    }
  }
  out.fees = fees;

  const retro = {};
  if (keysOf(raw.retro, "retro", ["fee", "confirmYears"])) {
    retro.fee = cents(raw.retro.fee, "retro.fee", 0, MAX_FEE);
    retro.confirmYears = int(raw.retro.confirmYears, "retro.confirmYears", 0, 100, "years");
  }
  out.retro = retro;

  if (raw.rush !== undefined && raw.rush !== null) {
    if (keysOf(raw.rush, "rush", ["fee", "turnaround"])) {
      out.rush = { fee: cents(raw.rush.fee, "rush.fee", 100, MAX_FEE), turnaround: line(raw.rush.turnaround, "rush.turnaround", 1, 80) };
    }
  }

  const tr = raw.travel, travel = {};
  if (isPlainObject(tr) && tr.mode === "none") {
    keysOf(tr, "travel", ["mode"]);
    travel.mode = "none";
  } else if (isPlainObject(tr) && tr.mode === "towns") {
    keysOf(tr, "travel", ["mode", "zones"]);
    travel.mode = "towns";
    travel.zones = [];
    const seen = new Map();
    if (!Array.isArray(tr.zones) || tr.zones.length < 1 || tr.zones.length > 20) bad("travel.zones", "Add 1 to 20 zones.");
    else tr.zones.forEach((z, i) => {
      const p = "travel.zones." + i;
      if (!keysOf(z, p, ["label", "fee", "towns"])) return;
      const zone = { label: line(z.label, p + ".label", 1, 60), fee: cents(z.fee, p + ".fee", 0, MAX_FEE), towns: [] };
      if (!Array.isArray(z.towns) || z.towns.length < 1 || z.towns.length > 300) bad(p + ".towns", "List 1 to 300 towns.");
      else z.towns.forEach((t, j) => {
        const name = line(t, p + ".towns", 1, 60);
        const key = name.toLowerCase();
        if (name && seen.has(key)) bad(p + ".towns", "\u201c" + name + "\u201d is listed twice (" + seen.get(key) + ").");
        else if (name) seen.set(key, zone.label || "zone " + (i + 1));
        zone.towns.push(name);
      });
      travel.zones.push(zone);
    });
  } else if (isPlainObject(tr) && tr.mode === "km") {
    keysOf(tr, "travel", ["mode", "from", "bands"]);
    travel.mode = "km";
    travel.from = line(tr.from, "travel.from", 1, 80);
    travel.bands = [];
    if (!Array.isArray(tr.bands) || tr.bands.length < 1 || tr.bands.length > 10) bad("travel.bands", "Add 1 to 10 distance bands.");
    else tr.bands.forEach((b, i) => {
      const p = "travel.bands." + i;
      if (!keysOf(b, p, ["upTo", "fee"])) return;
      const band = { upTo: int(b.upTo, p + ".upTo", 1, 1000, "km"), fee: cents(b.fee, p + ".fee", 0, MAX_FEE) };
      if (i > 0 && travel.bands[i - 1] && band.upTo <= travel.bands[i - 1].upTo) bad(p + ".upTo", "Each band must reach further than the one before.");
      travel.bands.push(band);
    });
  } else {
    bad("travel", "Travel must be none, towns or km.");
  }
  out.travel = travel;

  if (raw.complex !== undefined && raw.complex !== null) {
    if (keysOf(raw.complex, "complex", ["hint"])) out.complex = { hint: line(raw.complex.hint, "complex.hint", 1, 200) };
  }
  out.confirmHours = int(raw.confirmHours, "confirmHours", 1, 168, "hours");

  const codes = PROVINCES.map(p => p[0]);
  out.provinces = [];
  if (!Array.isArray(raw.provinces) || raw.provinces.length < 1) bad("provinces", "Pick the province (or provinces) your properties are in.");
  else raw.provinces.forEach((c, i) => {
    if (!codes.includes(c) || out.provinces.includes(c)) bad("provinces." + i, "Unknown or repeated province.");
    else out.provinces.push(c);
  });
  out.tax = {};
  if (keysOf(raw.tax, "tax", out.provinces)) {
    for (const c of out.provinces) {
      const lines = raw.tax[c], p = "tax." + c;
      if (!Array.isArray(lines) || lines.length > 2) { bad(p, "Up to two tax lines."); continue; }
      out.tax[c] = lines.map((l, i) => {
        if (!keysOf(l, p + "." + i, ["label", "rate"])) return { label: "", rate: 0 };
        return { label: line(l.label, p + "." + i + ".label", 1, 20), rate: int(l.rate, p + "." + i + ".rate", 1, 30000, "thousandths of a percent") };
      });
    }
  }

  const d = raw.deposit;
  if (isPlainObject(d) && d.mode === "none") { keysOf(d, "deposit", ["mode"]); out.deposit = { mode: "none" }; }
  else if (isPlainObject(d) && d.mode === "percent") { keysOf(d, "deposit", ["mode", "percent"]); out.deposit = { mode: "percent", percent: int(d.percent, "deposit.percent", 1, 100, "percent") }; }
  else if (isPlainObject(d) && d.mode === "fixed") { keysOf(d, "deposit", ["mode", "fee"]); out.deposit = { mode: "fixed", fee: cents(d.fee, "deposit.fee", 100, MAX_FEE) }; }
  else { bad("deposit", "Deposit must be none, percent or fixed."); out.deposit = { mode: "none" }; }

  out.turnaround = line(raw.turnaround, "turnaround", 1, 120);
  const pay = {};
  if (keysOf(raw.payment, "payment", ["etransfer", "link", "note"])) {
    pay.etransfer = line(raw.payment.etransfer, "payment.etransfer", 0, 120);
    if (pay.etransfer && !isEmail(pay.etransfer)) bad("payment.etransfer", "Not an email address.");
    const rawLink = typeof raw.payment.link === "string" ? raw.payment.link.trim() : raw.payment.link;
    pay.link = "";
    if (typeof rawLink !== "string") bad("payment.link", "Must be text.");
    else if (rawLink) {
      pay.link = httpsLink(rawLink);
      if (!pay.link) bad("payment.link", "Only a full https:// link to your payment page is allowed.");
    }
    pay.note = line(raw.payment.note, "payment.note", 0, 200);
    if (out.deposit.mode !== "none" && !pay.etransfer && !pay.link) bad("payment", "A deposit needs an e-transfer email or a payment link.");
  }
  out.payment = pay;
  out.terms = text(raw.terms, "terms", 8000);

  return errors.length ? { rules: null, errors } : { rules: out, errors: [] };
}

// ------------------------------------------------------------------ the arithmetic

/** Work out the quote for the client's choices. `sel`: {purpose, type, when: "current"|"past", date, province,
    place: "zone.town" | "band index" | "other" | "beyond", rush, complex}. Returns
    {status: "incomplete"|"confirm"|"priced", missing, problems, confirm, lines, subtotal, taxes, total, deposit}.
    Nothing here guesses: a blank price, an unlisted town or a date too far back becomes "we'll confirm". */
function priceQuote(rules, sel, today) {
  const r = { status: "incomplete", missing: [], problems: [], confirm: [], lines: [], subtotal: 0, taxes: [], total: 0, deposit: 0, province: "", place: null };
  const p = rules.purposes.find(x => x.id === sel.purpose);
  const t = rules.types.find(x => x.id === sel.type);
  if (!p) r.missing.push("purpose");
  if (!t) r.missing.push("type");
  if (sel.when !== "current" && sel.when !== "past") r.missing.push("when");
  else if (sel.when === "past") {
    if (!sel.date) r.missing.push("date");
    else if (!isIsoDate(sel.date)) r.problems.push("dateBad");
    else if (sel.date >= today) r.problems.push("dateNotPast");
  }
  const tr = rules.travel;
  if (tr.mode === "towns") {
    if (!sel.place) r.missing.push("place");
    else if (sel.place === "other") r.place = { other: true };
    else {
      const m = /^(\d+)\.(\d+)$/.exec(sel.place);
      const z = m && tr.zones[+m[1]];
      if (!z || !z.towns[+m[2]]) r.missing.push("place");
      else r.place = { zone: z, town: z.towns[+m[2]] };
    }
  } else if (tr.mode === "km") {
    if (!sel.place) r.missing.push("place");
    else if (sel.place === "beyond") r.place = { beyond: tr.bands[tr.bands.length - 1].upTo };
    else {
      const i = /^\d+$/.test(sel.place) ? +sel.place : -1;
      if (!tr.bands[i]) r.missing.push("place");
      else r.place = { band: tr.bands[i], index: i };
    }
  }
  r.province = rules.provinces.length === 1 ? rules.provinces[0] : sel.province;
  if (!rules.provinces.includes(r.province)) { r.province = ""; r.missing.push("province"); }
  if (r.missing.length || r.problems.length) return r;

  const base = rules.fees[p.id][t.id];
  if (base === null) r.confirm.push({ code: "caseByCase" });
  else r.lines.push({ code: "base", cents: base });
  if (sel.when === "past") {
    if (rules.retro.confirmYears > 0 && sel.date < yearsBefore(today, rules.retro.confirmYears)) r.confirm.push({ code: "oldDate", years: rules.retro.confirmYears });
    else if (rules.retro.fee > 0) r.lines.push({ code: "retro", cents: rules.retro.fee });
  }
  const pl = r.place || {};  // null when the firm charges no travel
  if (pl.other) r.confirm.push({ code: "townOther" });
  if (pl.beyond) r.confirm.push({ code: "beyond", km: pl.beyond });
  if (pl.zone && pl.zone.fee > 0) r.lines.push({ code: "travelZone", cents: pl.zone.fee, zone: pl.zone.label });
  if (pl.band && pl.band.fee > 0) r.lines.push({ code: "travelKm", cents: pl.band.fee, index: pl.index });
  if (sel.rush && rules.rush) r.lines.push({ code: "rush", cents: rules.rush.fee });
  if (sel.complex && rules.complex) r.confirm.push({ code: "complex" });
  if (r.confirm.length) { r.status = "confirm"; return r; }

  r.subtotal = r.lines.reduce((a, l) => a + l.cents, 0);
  r.taxes = rules.tax[r.province].map(l => ({ label: l.label, rate: l.rate, cents: roundDiv(r.subtotal * l.rate, 100000) }));
  r.total = r.subtotal + r.taxes.reduce((a, l) => a + l.cents, 0);
  const d = rules.deposit;
  r.deposit = d.mode === "percent" ? roundDiv(r.total * d.percent, 100) : d.mode === "fixed" ? Math.min(d.fee, r.total) : 0;
  r.status = "priced";
  return r;
}

// ------------------------------------------------------------------ DOM

/** Build an element. Text always goes in as text (never HTML); an href must be https:, mailto:, tel: or #. */
function el(tag, attrs) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "href") {
      if (!/^(https:|mailto:|tel:|#)/.test(String(v))) throw new Error("refused link");
      n.setAttribute("href", v);
    } else if (/^(src|srcdoc|style|innerHTML|outerHTML)$/i.test(k)) throw new Error("refused attribute " + k);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [arguments[i]].flat(Infinity);
    for (const c of kids) if (c !== null && c !== undefined && c !== false) n.append(c instanceof Node ? c : String(c));
  }
  return n;
}

/** Replace a node's children; nested lists are flattened and null, undefined and false are skipped (the DOM's own
    replaceChildren would print them as text). */
function fill(node) {
  node.replaceChildren(...[].slice.call(arguments, 1).flat(Infinity).filter(k => k !== null && k !== undefined && k !== false));
  return node;
}
/* shared:end */

const $ = id => document.getElementById(id);
const TEMPLATE = JSON.parse($("quote-template").textContent);
const SAMPLE = JSON.parse($("sample-rules").textContent);
const CONFIG_RE = /(<script type="application\/json" id="quote-config">)([\s\S]*?)(<\/script>)/;
const TITLE_RE = /<title>[^<]*<\/title>/;
const DESC_RE = /<meta name="description" content="[^"]*">/;
const NOSCRIPT_RE = /<p class="noscript" id="noscript">[^<]*<\/p>/;
// Built from a string so this page's own source never matches the pattern sync.py uses to find this page's policy.
const CSP_RE = new RegExp("(<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src )([^;\"]*)(;[^\"]*\")");
const SCRIPT_RE = /<script>([\s\S]*?)<\/script>/g;
// A draft is the form's own values, saved while problems still stand. It is its own format, so neither readRules()
// nor a client's page will ever take it for rules.
const DRAFT_FORMAT = "field-office-quote-draft";
const DRAFT_TEXT_MAX = 50000;

let draft = blankDraft();
let unsaved = false;
let lastErrors = [];
let lastRules = null;
// Fields show their own problems once touched, or all of them after a download or save is tried.
const touched = new Set();
let showAll = false;

// ------------------------------------------------------------------ the draft: the form's own values, as typed

function blankDraft() {
  return {
    sample: "",
    firm: { name: "", logoText: "", color: "#1d4f91", email: "", phone: "", area: "" },
    pricesFrom: localToday(), validDays: "30",
    purposes: PURPOSE_DEFAULTS.map(([id, label]) => ({ id, label, on: id !== "other" })),
    types: TYPE_DEFAULTS.map(([id, label]) => ({ id, label, on: true })),
    fees: Object.fromEntries(PURPOSE_DEFAULTS.map(([p]) => [p, Object.fromEntries(TYPE_DEFAULTS.map(([x]) => [x, ""]))])),
    retro: { fee: "", confirmYears: "10" },
    rush: { on: false, fee: "", turnaround: "" },
    travel: { mode: "none", zones: [{ label: "", fee: "0", towns: "" }], from: "", bands: [{ upTo: "25", fee: "0" }] },
    complex: { on: true, hint: "Over 4,000 sq ft, over 10 acres, more than one home on the lot, or unusual construction" },
    confirmHours: "24",
    provinces: [],
    tax: {},
    deposit: { mode: "percent", percent: "50", fee: "" },
    turnaround: "",
    payment: { etransfer: "", link: "", note: "" },
    terms: "",
  };
}

function centsText(c) { return c % 100 ? (c / 100).toFixed(2) : String(c / 100); }
function rateText(r) { return ratePercent(r).replace("%", ""); }

/** A rules file, already read strictly, as the form's values. */
function draftFromRules(R) {
  const d = blankDraft();
  d.sample = R.sample || "";
  d.firm = Object.assign({}, R.firm);
  d.pricesFrom = R.pricesFrom;
  d.validDays = String(R.validDays);
  d.purposes = PURPOSE_DEFAULTS.map(([id, label]) => { const p = R.purposes.find(x => x.id === id); return { id, label: p ? p.label : label, on: !!p }; });
  d.types = TYPE_DEFAULTS.map(([id, label]) => { const p = R.types.find(x => x.id === id); return { id, label: p ? p.label : label, on: !!p }; });
  for (const p of R.purposes) for (const x of R.types) { const v = R.fees[p.id][x.id]; d.fees[p.id][x.id] = v === null ? "" : centsText(v); }
  d.retro = { fee: R.retro.fee ? centsText(R.retro.fee) : "", confirmYears: String(R.retro.confirmYears) };
  d.rush = R.rush ? { on: true, fee: centsText(R.rush.fee), turnaround: R.rush.turnaround } : { on: false, fee: "", turnaround: "" };
  d.travel.mode = R.travel.mode;
  if (R.travel.mode === "towns") d.travel.zones = R.travel.zones.map(z => ({ label: z.label, fee: centsText(z.fee), towns: z.towns.join("\n") }));
  if (R.travel.mode === "km") { d.travel.from = R.travel.from; d.travel.bands = R.travel.bands.map(b => ({ upTo: String(b.upTo), fee: centsText(b.fee) })); }
  d.complex = R.complex ? { on: true, hint: R.complex.hint } : { on: false, hint: d.complex.hint };
  d.confirmHours = String(R.confirmHours);
  d.provinces = R.provinces.slice();
  d.tax = {};
  for (const c of R.provinces) d.tax[c] = R.tax[c].map(l => ({ label: l.label, rate: rateText(l.rate) }));
  d.deposit = { mode: R.deposit.mode, percent: R.deposit.mode === "percent" ? String(R.deposit.percent) : "50", fee: R.deposit.mode === "fixed" ? centsText(R.deposit.fee) : "" };
  d.turnaround = R.turnaround;
  d.payment = Object.assign({}, R.payment);
  d.terms = R.terms;
  return d;
}

/** "550", "550.00", "$1,250.5" -> cents; "" -> "blank"; anything else -> null. */
function parseMoney(s) {
  const v = String(s === undefined || s === null ? "" : s).replace(/[\s$,]/g, "");
  if (v === "") return "blank";
  const m = /^(\d{1,6})(?:\.(\d{1,2}))?$/.exec(v);
  return m ? +m[1] * 100 + +(m[2] || "0").padEnd(2, "0") : null;
}
/** "15", "9.975", "13%" -> thousandths of a percent; anything else -> null. */
function parseRate(s) {
  const m = /^(\d{1,2})(?:\.(\d{1,3}))?$/.exec(String(s).trim().replace(/\s*%$/, ""));
  return m ? +m[1] * 1000 + +(m[2] || "0").padEnd(3, "0") : null;
}

/** The form's values as a rules object for readRules(), plus the problems only the form can see (an amount that is
    not an amount) and the map from rules paths back to form paths (only offered purposes and types are in the rules). */
function draftToRaw(d) {
  const errs = [], map = {};
  const amt = (s, path, blank) => {
    const v = parseMoney(s);
    if (v === "blank") { if (blank === "required") { errs.push({ path, msg: "Required." }); return undefined; } return blank; }
    if (v === null) { errs.push({ path, msg: "Write an amount like 550 or 550.00." }); return undefined; }
    return v;
  };
  const whole = (s, path) => {
    const v = String(s).trim();
    if (!/^\d{1,6}$/.test(v)) { errs.push({ path, msg: v ? "Write a whole number." : "Required." }); return undefined; }
    return +v;
  };
  const raw = { format: QUOTE_FORMAT, version: QUOTE_VERSION };
  if (d.sample) raw.sample = d.sample;
  raw.firm = Object.assign({}, d.firm);
  raw.pricesFrom = d.pricesFrom;
  raw.validDays = whole(d.validDays, "validDays");
  const pOn = d.purposes.map((p, i) => [p, i]).filter(([p]) => p.on), tOn = d.types.map((x, i) => [x, i]).filter(([x]) => x.on);
  raw.purposes = pOn.map(([p, i], j) => { map["purposes." + j] = "purposes." + i; return { id: p.id, label: p.label }; });
  raw.types = tOn.map(([x, i], j) => { map["types." + j] = "types." + i; return { id: x.id, label: x.label }; });
  raw.fees = {};
  for (const [p] of pOn) {
    raw.fees[p.id] = {};
    for (const [x] of tOn) raw.fees[p.id][x.id] = amt(d.fees[p.id][x.id], "fees." + p.id + "." + x.id, null);
  }
  raw.retro = { fee: amt(d.retro.fee, "retro.fee", 0), confirmYears: whole(d.retro.confirmYears, "retro.confirmYears") };
  if (d.rush.on) raw.rush = { fee: amt(d.rush.fee, "rush.fee", "required"), turnaround: d.rush.turnaround };
  const tr = d.travel;
  if (tr.mode === "towns") {
    raw.travel = { mode: "towns", zones: tr.zones.map((z, i) => ({ label: z.label, fee: amt(z.fee, "travel.zones." + i + ".fee", 0),
      towns: z.towns.split("\n").map(s => s.trim()).filter(Boolean) })) };
  } else if (tr.mode === "km") {
    raw.travel = { mode: "km", from: tr.from, bands: tr.bands.map((b, i) => ({ upTo: whole(b.upTo, "travel.bands." + i + ".upTo"), fee: amt(b.fee, "travel.bands." + i + ".fee", 0) })) };
  } else raw.travel = { mode: "none" };
  if (d.complex.on) raw.complex = { hint: d.complex.hint };
  raw.confirmHours = whole(d.confirmHours, "confirmHours");
  raw.provinces = PROVINCES.map(p => p[0]).filter(c => d.provinces.includes(c));
  raw.tax = {};
  for (const c of raw.provinces) raw.tax[c] = (d.tax[c] || []).map((l, i) => {
    const r = parseRate(l.rate);
    if (r === null) errs.push({ path: "tax." + c + "." + i + ".rate", msg: "Write a rate like 15 or 9.975." });
    return { label: l.label, rate: r === null ? undefined : r };
  });
  const dep = d.deposit;
  raw.deposit = dep.mode === "percent" ? { mode: "percent", percent: whole(dep.percent, "deposit.percent") }
    : dep.mode === "fixed" ? { mode: "fixed", fee: amt(dep.fee, "deposit.fee", "required") } : { mode: "none" };
  raw.turnaround = d.turnaround;
  raw.payment = Object.assign({}, d.payment);
  raw.terms = d.terms;
  return { raw, errs, map };
}

/** A draft file read back as untrusted data: exactly the form's own keys, only text and ticks, ids in the form's
    order and lists within the form's limits. Its values then go only into the form, which reads them through
    readRules() like anything typed, so a draft never becomes a page by itself. Returns {draft, errors}. */
function readDraft(raw) {
  const errors = [];
  const bad = (path, msg) => { errors.push({ path, msg }); };
  const proto = protoKeyPath(raw, "");
  if (proto) return { draft: null, errors: [{ path: proto, msg: "A key named __proto__, constructor or prototype is not allowed." }] };
  const group = (v, path, allowed) => {
    if (!isPlainObject(v)) { bad(path, "Must be a group of settings."); return false; }
    const before = errors.length, at = k => (path ? path + "." : "") + k;
    for (const k of Object.keys(v)) if (!allowed.includes(k)) bad(at(k), "Unknown setting.");
    for (const k of allowed) if (!(k in v)) bad(at(k), "Missing.");
    return errors.length === before;
  };
  const str = (v, path) => {
    if (typeof v === "string" && v.length <= DRAFT_TEXT_MAX) return v;
    bad(path, typeof v === "string" ? "Too long." : "Must be text.");
    return "";
  };
  const strs = (v, path, names) => Object.fromEntries(names.map(k => [k, str(v[k], path + "." + k)]));
  const tick = (v, path) => { if (typeof v === "boolean") return v; bad(path, "Must be true or false."); return false; };
  const list = (v, path, min, max) => {
    if (Array.isArray(v) && v.length >= min && v.length <= max) return v;
    bad(path, "Must be a list of " + min + " to " + max + ".");
    return null;
  };
  const oneOf = (v, path, modes) => { if (modes.includes(v)) return v; bad(path, "Must be " + modes.slice(0, -1).join(", ") + " or " + modes[modes.length - 1] + "."); return modes[0]; };

  if (!group(raw, "", ["format", "version", "draft"])) return { draft: null, errors };
  if (raw.format !== DRAFT_FORMAT) bad("format", "Not a quote draft.");
  if (raw.version !== QUOTE_VERSION) bad("version", "Version " + QUOTE_VERSION + " is the only version this page reads.");
  const r = raw.draft, d = blankDraft();
  if (!group(r, "draft", Object.keys(d))) return { draft: null, errors };
  d.sample = str(r.sample, "draft.sample");
  if (group(r.firm, "draft.firm", Object.keys(d.firm))) d.firm = strs(r.firm, "draft.firm", Object.keys(d.firm));
  d.pricesFrom = str(r.pricesFrom, "draft.pricesFrom");
  d.validDays = str(r.validDays, "draft.validDays");
  for (const [key, defaults] of [["purposes", PURPOSE_DEFAULTS], ["types", TYPE_DEFAULTS]]) {
    const arr = list(r[key], "draft." + key, defaults.length, defaults.length);
    if (arr) d[key] = defaults.map(([id], i) => {
      const x = arr[i], p = "draft." + key + "." + i;
      if (!group(x, p, ["id", "label", "on"])) return d[key][i];
      if (x.id !== id) bad(p + ".id", "Not the form's own list.");
      return { id, label: str(x.label, p + ".label"), on: tick(x.on, p + ".on") };
    });
  }
  const typeIds = TYPE_DEFAULTS.map(x => x[0]);
  if (group(r.fees, "draft.fees", PURPOSE_DEFAULTS.map(x => x[0]))) {
    for (const [pid] of PURPOSE_DEFAULTS) if (group(r.fees[pid], "draft.fees." + pid, typeIds)) d.fees[pid] = strs(r.fees[pid], "draft.fees." + pid, typeIds);
  }
  if (group(r.retro, "draft.retro", ["fee", "confirmYears"])) d.retro = strs(r.retro, "draft.retro", ["fee", "confirmYears"]);
  if (group(r.rush, "draft.rush", ["on", "fee", "turnaround"])) d.rush = { on: tick(r.rush.on, "draft.rush.on"), fee: str(r.rush.fee, "draft.rush.fee"), turnaround: str(r.rush.turnaround, "draft.rush.turnaround") };
  const tr = r.travel;
  if (group(tr, "draft.travel", ["mode", "zones", "from", "bands"])) {
    d.travel.mode = oneOf(tr.mode, "draft.travel.mode", ["none", "towns", "km"]);
    d.travel.from = str(tr.from, "draft.travel.from");
    const zones = list(tr.zones, "draft.travel.zones", 1, 20), bands = list(tr.bands, "draft.travel.bands", 1, 10);
    const each = (arr, path, names) => arr.map((x, i) => (group(x, path + "." + i, names) ? strs(x, path + "." + i, names) : {}));
    if (zones) d.travel.zones = each(zones, "draft.travel.zones", ["label", "fee", "towns"]);
    if (bands) d.travel.bands = each(bands, "draft.travel.bands", ["upTo", "fee"]);
  }
  if (group(r.complex, "draft.complex", ["on", "hint"])) d.complex = { on: tick(r.complex.on, "draft.complex.on"), hint: str(r.complex.hint, "draft.complex.hint") };
  d.confirmHours = str(r.confirmHours, "draft.confirmHours");
  const codes = PROVINCES.map(x => x[0]);
  const provs = list(r.provinces, "draft.provinces", 0, codes.length);
  if (provs && provs.some((c, i) => !codes.includes(c) || provs.indexOf(c) !== i)) bad("draft.provinces", "Unknown or repeated province.");
  else if (provs) d.provinces = provs.slice();
  if (group(r.tax, "draft.tax", Object.keys(r.tax || {}).filter(c => codes.includes(c)))) {
    for (const c of Object.keys(r.tax)) {
      const lines = list(r.tax[c], "draft.tax." + c, 0, 2);
      if (lines) d.tax[c] = lines.map((l, i) => (group(l, "draft.tax." + c + "." + i, ["label", "rate"]) ? strs(l, "draft.tax." + c + "." + i, ["label", "rate"]) : {}));
    }
  }
  if (group(r.deposit, "draft.deposit", ["mode", "percent", "fee"])) {
    d.deposit = { mode: oneOf(r.deposit.mode, "draft.deposit.mode", ["percent", "fixed", "none"]), percent: str(r.deposit.percent, "draft.deposit.percent"), fee: str(r.deposit.fee, "draft.deposit.fee") };
  }
  d.turnaround = str(r.turnaround, "draft.turnaround");
  if (group(r.payment, "draft.payment", ["etransfer", "link", "note"])) d.payment = strs(r.payment, "draft.payment", ["etransfer", "link", "note"]);
  d.terms = str(r.terms, "draft.terms");
  return errors.length ? { draft: null, errors } : { draft: d, errors: [] };
}

function toDraftPath(path, map) {
  if (path === "payment") return "payment.etransfer";
  if (map[path]) return map[path];
  for (const k of Object.keys(map)) if (path.startsWith(k + ".")) return map[k] + path.slice(k.length);
  return path;
}

/** Read the form: problems by form path, and the canonical rules when there are none. */
function evaluate() {
  const { raw, errs, map } = draftToRaw(draft);
  const read = readRules(raw);
  const seen = new Set(errs.map(e => e.path));
  const all = errs.slice();
  for (const e of read.errors) {
    const p = toDraftPath(e.path, map);
    if (!seen.has(p)) { seen.add(p); all.push({ path: p, msg: e.msg }); }
  }
  return { errors: all, rules: all.length ? null : read.rules };
}

// ------------------------------------------------------------------ the page that gets built

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
}

function replaceOne(text, re, fn, what) {
  const all = text.match(new RegExp(re.source, "g"));
  if (!all || all.length !== 1) throw new Error("The page template is damaged: " + what + ".");
  return text.replace(re, fn);
}

/** The firm's quote page: the template with the rules in its data block, the firm's name in the title,
    description and no-script line (HTML-escaped), and the policy naming the sha256 of the page's own script.
    sync.py's build() is the same steps in Python; samples/quote.html is its output for the sample rules. */
function buildQuotePage(rules) {
  const firm = rules.firm;
  const data = JSON.stringify(rules).replace(/</g, "\\u003c");
  let page = TEMPLATE;
  for (const [what, re] of [["rules block", CONFIG_RE], ["title", TITLE_RE], ["description", DESC_RE], ["no-script line", NOSCRIPT_RE], ["policy", CSP_RE]]) {
    replaceOne(page, re, m => m, what);
  }
  page = page.replace(CONFIG_RE, (m, a, b, c) => a + data + c);
  page = page.replace(TITLE_RE, () => "<title>" + escHtml(firm.name + ": appraisal quote") + "</title>");
  page = page.replace(DESC_RE, () => '<meta name="description" content="' + escHtml("See your appraisal price from " + firm.name + " now, and request the appraisal.") + '">');
  const reach = "Email " + firm.email + (firm.phone ? " or call " + firm.phone : "") + ".";
  page = page.replace(NOSCRIPT_RE, () => '<p class="noscript" id="noscript">' + escHtml("This page needs JavaScript to work out your price. " + reach) + "</p>");
  const scripts = [...page.matchAll(SCRIPT_RE)];
  if (scripts.length !== 1) throw new Error("The page template is damaged: it must have exactly one script.");
  const hash = sha256Base64(scripts[0][1]);
  page = replaceOne(page, CSP_RE, (m, a, b, c) => a + "'sha256-" + hash + "'" + c, "policy");
  const back = JSON.parse(CONFIG_RE.exec(page)[2]);
  if (JSON.stringify(back) !== JSON.stringify(rules)) throw new Error("The rules did not read back the same from the built page.");
  return { page, hash, script: scripts[0][1] };
}

const K256 = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
];

/** SHA-256 of a string's UTF-8 bytes, base64. Plain JavaScript, so it works from file:// and on any host;
    the download also checks it against the browser's own SubtleCrypto where that exists. */
function sha256Base64(str) {
  const bytes = new TextEncoder().encode(str);
  const len = bytes.length, total = Math.ceil((len + 9) / 64) * 64;
  const m = new Uint8Array(total);
  m.set(bytes);
  m[len] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 8, Math.floor(len / 0x20000000));
  dv.setUint32(total - 4, (len * 8) >>> 0);
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const w = new Uint32Array(64);
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (ror(a, 7) ^ ror(a, 18) ^ (a >>> 3)) + w[i - 7] + (ror(b, 17) ^ ror(b, 19) ^ (b >>> 10))) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K256[i] + w[i]) >>> 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  let bin = "";
  for (const v of H) bin += String.fromCharCode(v >>> 24, (v >>> 16) & 255, (v >>> 8) & 255, v & 255);
  return btoa(bin);
}

async function subtleHash(str) {
  if (!(window.crypto && crypto.subtle && window.isSecureContext)) return "";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return btoa(String.fromCharCode(...new Uint8Array(buf)));

function markDirty() { unsaved = true; $("dirty").hidden = false; }
function markSaved() { unsaved = false; $("dirty").hidden = true; }

$("editor").addEventListener("input", onEdit);
$("editor").addEventListener("change", onEdit);
function onEdit(e) {
  const t = e.target;
  if (t.dataset && t.dataset.pick) {
    if (e.type !== "input") return;
    setPath(draft, t.dataset.pick, t.value);
    const txt = document.querySelector('[data-k="' + t.dataset.pick + '"]');
    if (txt) txt.value = t.value;
    markDirty();
    return refresh();
  }
  const k = t.dataset && t.dataset.k;
  if (!k) return;
  touched.add(k);
  if (t.type === "checkbox" && t.dataset.list) {
    if (e.type !== "change") return;
    const list = getPath(draft, k).filter(v => v !== t.value);
    if (t.checked) list.push(t.value);
    setPath(draft, k, list);
    if (k === "provinces" && t.checked && !draft.tax[t.value]) draft.tax[t.value] = startingTax(t.value);
  } else if (t.type === "checkbox") {
    if (e.type !== "change") return;
    setPath(draft, k, t.checked);
  } else if (t.type === "radio") {
    if (e.type !== "change" || !t.checked) return;
    setPath(draft, k, t.value);
  } else {
    if (e.type === "change" && t.tagName !== "SELECT") return;
    setPath(draft, k, t.value);
    if (k === "firm.color") { const pick = document.querySelector('[data-pick="firm.color"]'); if (pick && COLOR_RE.test(t.value)) pick.value = t.value.toLowerCase(); }
  }
  markDirty();
  if (t.dataset.struct) render(); else refresh();
}

function startingTax(code) { return PROVINCES.find(p => p[0] === code)[2].map(([label, rate]) => ({ label, rate: rateText(rate) })); }

$("editor").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const ds = b.dataset;
  if (b.id === "load-sample") return loadRules(SAMPLE, "the sample firm");
  if (b.id === "start-blank") { if (unsaved && !confirm("Start blank? Your unsaved changes will be lost.")) return; draft = blankDraft(); touched.clear(); showAll = false; markSaved(); return render(); }
  if (b.id === "save-rules" || b.id === "save-rules-2") return saveRules();

  if (b.id === "unsample") { draft.sample = ""; markDirty(); return render(); }

function showState() {

  document.querySelectorAll(".ferr").forEach(n => { n.hidden = true; n.textContent = ""; });

    }
    const top = { purposes: "Purposes", types: "Property types", provinces: "Sales tax", travel: "Travel", fees: "Base fees" }[e.path.split(".")[0]];
    const label = input && input.type !== "checkbox" ? input.dataset.label || e.path : top || e.path || "Rules";

      named.length > 12 ? el("p", { text: "and " + (named.length - 12) + " more." }) : null));
    $("size").textContent = "";
  } else {
    // Ready either way, but a page with no fee at all never shows a price, which defeats it: say so plainly.
    const combos = rules.purposes.flatMap(p => rules.types.map(x => rules.fees[p.id][x.id]));
    const blank = combos.filter(v => v === null).length;
    const hours = rules.confirmHours;
    box.replaceChildren(blank === combos.length
      ? el("div", { class: "note warn", role: "status" }, el("p", null,

let shownPreview = "";
function showPreview() {
