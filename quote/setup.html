  paused.hidden = true;
  let built;
  try { built = buildQuotePage(lastRules); } catch (err) { paused.textContent = String(err.message || err); paused.hidden = false; return; }

function toast(msg, bad) {
  const tEl = $("toast");
  tEl.textContent = msg;
  tEl.classList.toggle("err", !!bad);
  tEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => tEl.classList.remove("show"), bad ? 6000 : 3000);
}

function saveBlob(text, name, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/** Save the rules, or, while problems still stand, a draft of the form's own values. A setup stopped halfway (no
    payment link yet, a GST question for the accountant) is then never lost; only Download needs a clean form. */
function saveRules() {
  showAll = true;
  showState();
  if (lastRules) {
    saveBlob(JSON.stringify(lastRules, null, 2) + "\n", "quote-rules-" + (lastRules.sample ? "SAMPLE-" : "") + localToday() + ".json", "application/json");
    markSaved();
    return toast("Rules file saved. Keep it with your office files: open it here to change your page later.");
  }
  const n = lastErrors.length;
  saveBlob(JSON.stringify({ format: DRAFT_FORMAT, version: QUOTE_VERSION, draft }, null, 2) + "\n",
    "quote-rules-" + (draft.sample ? "SAMPLE-" : "") + "DRAFT-" + localToday() + ".json", "application/json");
  markSaved();
  toast("Draft saved, with " + n + (n === 1 ? " thing" : " things") + " still to fix. Open it here to carry on; quote.html downloads once " + (n === 1 ? "it is" : "they are") + " fixed.");
}

async function download() {
  showAll = true;
  showState();
  if (!lastRules) { $("status-box").scrollIntoView({ block: "center" }); return toast("Not downloaded: fix the problems listed under \u201cMake your page\u201d first.", true); }
  let built;
  try { built = buildQuotePage(lastRules); } catch (err) { return toast(String(err.message || err), true); }
  try {
    const check = await subtleHash(built.script);
    if (check && check !== built.hash) return toast("The page's security hash did not check out, so nothing was downloaded. Reload this page and try again.", true);
  } catch (e) { /* no SubtleCrypto here (an http: page); the pure-JavaScript hash stands */ }
  saveBlob(built.page, "quote.html", "text/html;charset=utf-8");
  toast("quote.html downloaded. Put it on your website in place of the old one.");
}

function loadRules(raw, what) {
  if (unsaved && !confirm("Open " + what + "? Your unsaved changes will be lost.")) return false;
  const isDraft = isPlainObject(raw) && raw.format === DRAFT_FORMAT;
  const read = isDraft ? readDraft(raw) : readRules(raw);
  const got = isDraft ? read.draft : read.rules;
  if (!got) {
    toast("Not opened: " + read.errors.slice(0, 5).map(e => (e.path ? e.path + ": " : "") + e.msg).join(" \u00b7 ") + (read.errors.length > 5 ? " (and " + (read.errors.length - 5) + " more)" : ""), true);
    return false;
  }
  draft = isDraft ? got : draftFromRules(got);
  touched.clear();
  showAll = isDraft;  // a draft was saved with problems standing: show them at once
  render();
  markSaved();
  toast(isDraft ? "Opened the draft " + what + ". What is still to fix is listed under \u201cMake your page\u201d." : "Opened " + what + ".");
  return true;
}

function openFile(file, input) {
  input.value = "";
  if (file.size > RULES_MAX_BYTES) return toast("Not opened: the file is over " + Math.round(RULES_MAX_BYTES / 1000) + " KB, so it is not a rules file or a quote page.", true);
  const fr = new FileReader();
  fr.onload = () => {
    const text = String(fr.result);
    let raw;
    try {
      if (/^\s*</.test(text)) {
        const m = CONFIG_RE.exec(text);
        if (!m) return toast("Not opened: that page has no quote rules in it.", true);
        raw = JSON.parse(m[2]);
      } else raw = JSON.parse(text);
    } catch (e) { return toast("Not opened: the file is not valid JSON.", true); }
    loadRules(raw, file.name);
  };
  fr.onerror = () => toast("Not opened: the file could not be read.", true);
  fr.readAsText(file);
}

render();
</script>
